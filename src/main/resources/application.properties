management.server.port=10000

server.forward-headers-strategy=framework



spring.boot.admin.client.url=https://adminserver-qfva.onrender.com
#spring.boot.admin.client.url=http://localhost:9090

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

management.info.env.enabled=true
logging.level.root=INFO

logging.level.com.boymask=DEBUG


management.endpoint.loggers.enabled=true
management.endpoint.logfile.enabled=true



spring.thymeleaf.locale=it_IT
spring.web.locale=it_IT
spring.web.locale-resolver=fixed

######################## LOG ###################################
logging.file.path=logs
logging.file.name=logs/app.log


# nuovo file ogni giorno e quando supera 10 MB
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log

# conserva solo gli ultimi 30 giorni
logging.logback.rollingpolicy.max-history=30

# limite totale occupato dai log
logging.logback.rollingpolicy.total-size-cap=1GB

# dimensione massima del singolo file
logging.logback.rollingpolicy.max-file-size=10MB

# pulizia all'avvio
logging.logback.rollingpolicy.clean-history-on-start=true