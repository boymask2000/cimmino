<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">

    <div class="card shadow" style="width: 380px;">

        <div class="card-body p-4">

            <h3 class="text-center mb-4">Login</h3>

            <form th:action="@{/login}" method="post">

<h4 class="mb-4">utente</h4>
                <!-- USERNAME -->
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Inserisci username" required>
                </div>
<h4 class="mb-4">1234</h4>
                <!-- PASSWORD -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Inserisci password" required>
                </div>

                <!-- ERROR -->
                <div th:if="${param.error}" class="alert alert-danger py-2">
                    Username o password errati
                </div>

                <!-- LOGOUT -->
                <div th:if="${param.logout}" class="alert alert-success py-2">
                    Logout effettuato
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-primary w-100">
                    Accedi
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
