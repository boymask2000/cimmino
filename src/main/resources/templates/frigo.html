<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Frigo</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.table-scroll {
	max-height: 500px;
	overflow-y: auto;
	border: 1px solid #dee2e6;
	border-radius: 0.5rem;
}

.table-scroll thead th {
	position: sticky;
	top: 0;
	z-index: 1;
}
</style>
</head>

<body>
<div class="card p-3 mb-3">

    <form method="get" th:action="@{/frigo/searchResult}">


<input type="hidden" name="startDate" th:value="${startDate}">
				<input type="hidden" name="endDate" th:value="${endDate}">

        <div class="row g-3 align-items-end">

            <!-- DATA DA -->
            <div class="col-md-3">
                <label class="form-label">Data da</label>
                <input type="date"
                       class="form-control"
                       name="dataDa"
                       th:value="${startDate}">
            </div>

            <!-- DATA A -->
            <div class="col-md-3">
                <label class="form-label">Data a</label>
                <input type="date"
                       class="form-control"
                       name="dataA"
                       th:value="${endDate}">
            </div>

          

            <!-- BOTTONI -->
            <div class="col-md-3 d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    🔎 Cerca
                </button>

                <a th:href="@{/movimentibin/reset}" class="btn btn-outline-secondary">
                    Reset
                </a>

            </div>

        </div>

    </form>

</div>
	<div class="container mt-4">



		<div class="d-flex justify-content-between align-items-center mb-3">

			<h2>Situazione frigo</h2>



		</div>


		<!-- LAYOUT AFFIANCATO -->
		<div class="row">
			<!-- TABELLA 30% -->
			<div class="col-12" >

				<div class="table-scroll">

					<table class="table table-bordered table-striped table-hover mb-0">

						<thead class="table-dark">
							<tr>
								<th>Data</th>
								<th>frigoxCaldo</th>
								<th>frigoxFreddo</th>
								<th>Totale</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="op : ${arrivi}">
								<td th:text="${op.data}"></td>
								<td class="text-end" th:text="${op.frigoxCaldo}"></td>
								<td class="text-end" th:text="${op.frigoxFreddo}"></td>
								<td></td>
							</tr>
						</tbody>
<tfoot class="table-dark">
<tr>
    <td colspan="1" class="text-end fw-bold">Totale</td>
    <td class="text-end" th:text="${totaleFrigoxCaldo}"></td>
								<td class="text-end" th:text="${totaleFrigoxFreddo}"></td>
								<td class="text-end" th:text="${sum}"></td>
</tr>
</tfoot>
					</table>

				</div>
			</div>

	

		</div>


	</div>

</body>
</html>
