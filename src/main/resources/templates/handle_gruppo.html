<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Gruppo Vendita</title>

<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container mt-4">

		<h2 class="mb-4">Gruppo Vendita</h2>
		<div class="table-responsive">

			<table class="table table-bordered table-striped text-center">

				<tr th:each="b : ${gruppo.bins}">
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.commerciante.name}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.merce.name}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.data}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.ddt}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.numeroTotaleBins}"></span>
					</span></td>


					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.peso_lordo}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.nettoDiTara}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.nettoDiScarto}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.media}"></span>
					</span></td>

					<td><span class="badge bg-primary"> <span
							th:text="${b.gruppoVendita.scarto}"></span>
					</span></td>
				
					
					<td><span th:text="${b.gruppoVendita.importo}"></span></td>
				</tr>
			</table>
		</div>

		<form th:action="@{/gruppovendite/save}" th:object="${gruppo}"
			method="post" id="venditaForm">
			<div class="col-md-2" th:if="${gruppo.status=='0'}">
			
<input type="hidden" th:field="*{id}">
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Lordo Totale</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{pesoLordoTotale}"
						class="form-control" step="0.01">
				</div>
			</div>
			
				<button type="submit" class="btn btn-success">Salva 
			</button>
			</div>
		</form>
	</div>


</body>
</html>
