<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Gruppo Vendita</title>

<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h2 class="mb-4">Gruppo Vendita</h2>
		<div class="table-responsive">

			<table class="table table-bordered table-striped text-center">

				<tr th:each="b : ${gruppo.vendite}">
					<td><span class="badge bg-primary"> <span
							th:text="${b.commerciante.name}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.data}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.ddt}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.numeroTotaleBins}"></span>
					</span></td>


					<td><span class="badge bg-primary"> <span
							th:text="${b.peso_lordo}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.nettoDiTara}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.nettoDiScarto}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.media}"></span>
					</span></td>

					<td><span class="badge bg-primary"> <span
							th:text="${b.scarto}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${b.prezzo}"></span>
					</span></td>
					<td><span th:text="${b.frigo}"></span></td>
					<td><span th:text="${b.importo}"></span></td>
				</tr>
			</table>
		</div>

		<form th:action="@{/gruppovendite/save}" th:object="${gruppo}"
			method="post" id="venditaForm">
<input type="hidden" th:field="*{id}">
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Lordo Totale</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{pesoLordoTotale}"
						class="form-control" step="0.01">
				</div>
			</div>
			
				<button type="submit" class="btn btn-success">Salva 
			</button>
		</form>
	</div>


</body>
</html>
