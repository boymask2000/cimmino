<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Indirizzo Master</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h1 class="text-center mb-4">Inserisci Indirizzo Master</h1>

		<form th:action="@{/net/allineamento}" th:object="${master}"
			method="post">

			<div class="row mb-3">

				<div class="col-sm-9">
					<input type="text" th:field="*{indirizzo}" class="form-control">
				</div>
			</div>

			<button type="submit" class="btn btn-success">Start</button>

		</form>

	</div>

</body>
</html>
