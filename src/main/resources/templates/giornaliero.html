<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Arrivi</title>

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid mt-4">

	<div class="d-flex justify-content-between align-items-center mb-3">

    <h1 class="mb-0">Giornaliero</h1>

   <div class="d-flex align-items-center gap-3">

        <!-- DATA -->
        <div class="d-flex align-items-center gap-2">

    <label for="startDate" class="mb-0 fw-semibold">
        Data
    </label>

    <input type="date"
           id="startDate"
           name="startDate"  th:value="${startDate}"
           class="form-control">

</div>

        <!-- STAMPA -->
        <form th:action="@{/pdf/filter_arrivi}" class="mb-0">

            <input type="hidden" name="startDate" th:value="${startDate}">
            <input type="hidden" name="endDate" th:value="${startDate}">

            <button type="submit" class="btn btn-success">
                🖨 Stampa
            </button>

        </form>

    </div>

</div>



		<div id="arriviContainer">
    <div th:replace="arrivi_fragment :: contenuto"></div>
</div>
		</div>

	
</body>
<script>
document.getElementById("startDate")
        .addEventListener("change", aggiorna);

async function aggiorna() {

    const data =
        document.getElementById("startDate").value;

    const response =
        await fetch(
            `/web/giornaliero/fragment?startDate=${data}`
        );

    const html = await response.text();

    document.getElementById("arriviContainer")
            .innerHTML = html;
}
</script>
</html>
