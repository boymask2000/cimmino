<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Il Mio IP</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>

body {
    background-color: #f5f5f5;
}

.ip-card {
    max-width: 500px;
    margin: auto;
    margin-top: 120px;
    padding: 40px;
    border-radius: 15px;
    background-color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
}

.ip-value {
    font-size: 32px;
    font-weight: bold;
    color: #0d6efd;
    margin-top: 20px;
}

</style>
</head>

<body>

    <div class="container">

        <div class="ip-card">

            <h1>Il tuo indirizzo IP</h1>

            <div class="ip-value"
                 th:text="${ip}">
            </div>

        </div>

    </div>

</body>
</html>
