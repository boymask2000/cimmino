<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Arrivi</title>
<link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

    <h1 class="mb-0">Elenco Arrivi</h1>

    <a th:href="@{/web/arrivi/new}" class="btn btn-success">
        + Nuovo Arrivo
    </a>

</div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped text-center">

            <!-- 🔥 INTESTAZIONI -->
            <thead class="table-dark">
            <tr>
               
                <th>Data</th>
                <th>Merce</th>
                <th>Peso Lordo</th>
                <th>Peso Netto</th>
                <th>Calo</th>
                <th>Freddo</th>
                <th>Intestazione Merce</th>
                <th>Bins</th>
            </tr>
            </thead>

            <!-- 🔥 CORPO TABELLA -->
            <tbody>

            <tr th:each="a : ${results}">

               

                <td th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}"></td>

                <td th:text="${a.merce}"></td>

                <td th:text="${a.peso_lordo}"></td>

                <td th:text="${a.peso_netto}"></td>

                <td th:text="${a.calo}"></td>

                <td>
                    <span th:text="${a.freddo == 1 ? 'Freddo' : 'Caldo'}"></span>
                </td>

                <td th:text="${a.intestazione_merce}"></td>

                <!-- 🔥 LISTA BINS -->
                <td>
                    <div th:if="${#lists.isEmpty(a.bins)}">
                        <span class="text-muted">Nessun bin</span>
                    </div>

                    <ul class="list-unstyled mb-0" th:if="${!#lists.isEmpty(a.bins)}">

                        <li th:each="b : ${a.bins}">
                            <span class="badge bg-primary me-1">
                                Bin: <span th:text="${b.bin != null ? b.bin.name : 'N/A'}"></span>
                            </span>

                            <span class="badge bg-secondary">
                                Qta: <span th:text="${b.numBins}"></span>
                            </span>
                        </li>

                    </ul>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
