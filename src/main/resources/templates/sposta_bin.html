<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuovo Arrivo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">Inserisci Arrivo</h1>

    <form th:action="@{/movimentibin/save}" th:object="${binsarrivi}" method="post">


    <input type="hidden" name="binsJs" id="binsJs">
     <input type="hidden" name="operazione" id="operazione" th:value="${operazione}">

        <h5>Bins</h5>

        <div id="binsContainer"></div>

        <button type="button" class="btn btn-primary mb-3" onclick="addBin()">
            + Aggiungi Bin
        </button>

     
   

        <button type="submit" class="btn btn-success">
            Salva Arrivo
        </button>

    </form>

</div>

<script th:inline="javascript">

let index = 0;
const binsList = /*[[${binsJs}]]*/ [];


function addBin() {

    const container = document.getElementById("binsContainer");

    let options = `<option value="">Seleziona Bin</option>`;
    binsList.forEach(b => {
        options += `<option value="${b.name}">${b.name}</option>`;
    });

    const html = `
    <div class="row mb-3 bin-row align-items-center">

        <div class="col-md-2">
            <input type="number"
                   name="binsarrivi[${index}].numBins"
                   class="form-control numBins"
                   min="1"
                   placeholder="Qta"
                   oninput="aggiornaPesi(this)">
        </div>

        <div class="col-md-3">
            <select name="binsarrivi[${index}].bin.name"
                    class="form-select binSelect"
                    onchange="aggiornaPesi(this)">
                ${options}
            </select>
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoLordo" 
            	name="binsarrivi[${index}].pesoLordo"
            onchange="aggiornaTotali()">
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoNetto"
            	name="binsarrivi[${index}].pesoNetto"
            onchange="aggiornaTotali()">
        </div>

        <div class="col-md-3">
            <button type="button" class="btn btn-danger" onclick="removeRow(this)">
                X
            </button>
        </div>

    </div>`;

    container.insertAdjacentHTML("beforeend", html);
    index++;
}

function removeRow(btn) {
    btn.closest('.bin-row').remove();
    aggiornaTotali();
}

</script>

</body>
</html>
