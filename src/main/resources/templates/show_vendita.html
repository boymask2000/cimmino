<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Dettaglio Vendita</title>

<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Dettaglio Vendita</h2>

    <!-- ===================== HEADER ===================== -->

    <div class="mb-3">
        <label class="form-label">Data</label>
        <input type="date"
               th:value="${vendita.data}"
               class="form-control"
               disabled>
    </div>

    <div class="mb-3">
        <label class="form-label">Commerciante</label>
        <input type="text"
               th:value="${vendita.commerciante.name}"
               class="form-control"
               disabled>
    </div>

    <!-- ===================== BINS ===================== -->

    <h5>Bins</h5>

    <div class="table-responsive">
        <table class="table table-bordered">

            <thead class="table-dark">
            <tr>
                <th>Qta</th>
                <th>Bin</th>
                <th>Peso Lordo</th>
                <th>Peso Netto</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="b : ${vendita.bins}">
                <td th:text="${b.numBins}"></td>
                <td th:text="${b.bin.name}"></td>
                <td th:text="${b.pesoLordo}"></td>
                <td th:text="${b.pesoNetto}"></td>
            </tr>
            </tbody>

        </table>
    </div>

    <!-- ===================== TOTALI ===================== -->

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Peso Lordo</label>
        <div class="col-sm-9">
            <input type="number"
                   th:value="${vendita.peso_lordo}"
                   class="form-control"
                   disabled>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Peso Netto</label>
        <div class="col-sm-9">
            <input type="number"
                   th:value="${vendita.peso_netto}"
                   class="form-control"
                   disabled>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Importo</label>
        <div class="col-sm-9">
            <input type="number"
                   th:value="${vendita.importo}"
                   class="form-control"
                   disabled>
        </div>
    </div>

    <!-- ===================== BACK ===================== -->



</div>

</body>
</html>
