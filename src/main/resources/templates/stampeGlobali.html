<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Stampe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f5f7fb;
}

.page-title {
    font-weight: 600;
    letter-spacing: .5px;
}

.card {
    border: none;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}
</style>

</head>

<body>

<div class="container-fluid px-4 py-4">

    <!-- HEADER -->
    <div class="text-center mb-4">
        <h2 class="page-title">🖨 Area Stampe</h2>
        <p class="text-muted">Genera e stampa report arrivi e vendite</p>
    </div>

    <!-- CARD PRINCIPALE -->
    <div class="row justify-content-center">

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card p-4 text-center">

                <h5 class="mb-3">Stampa completa</h5>

                <p class="text-muted mb-4">
                    Esporta tutti gli arrivi e le vendite in un unico PDF.
                </p>

                <a th:href="@{/pdf/generale_arrivi}"
                   class="btn btn-success btn-lg w-100">
                    🖨 Genera PDF
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
