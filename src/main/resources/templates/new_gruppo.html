	<script>
	
	
	
	


	async function aggiornaArrivi(row) {

	    const merceId = row.querySelector(".merceSelect");
	    const binSelect = row.querySelector(".binSelect");
	    const arriviSelect = row.querySelector(".arriviSelect");

 
	 
	 const merceValue = Number(row.querySelector(".merceSelect")?.value) || 0;
	 const binValue = Number(row.querySelector(".binSelect")?.value) || 0;

	    try {

	        const response = await fetch(
	            `/gruppovendite/getArrivi?merceId=${merceValue}&binId=${binValue}`
	        );

	        const bins = await response.json();

	        arriviSelect.innerHTML =
	            '<option value="">Seleziona arrivo</option>';

	            bins.forEach(bin => {

	            const option = document.createElement("option");

	            option.value = bin;
	            option.textContent = bin;

	            arriviSelect.appendChild(option);
	        });

	    } catch (err) {

	        console.error(err);

	        binSelect.innerHTML =
	            '<option value="">Errore caricamento</option>';
	    }
	}

	
	
	
	


	    async function checkAvailability(row) {

	        const binSelect = row.querySelector(".binSelect");
	        const numBinsH = row.querySelector(".numBins");
	        const numBins = numBinsH.value||0;
	        const availabilityMsg = row.querySelector(".availabilityMsg");
	        const arriviSelect = row.querySelector(".arriviSelect").value||'0';

	      

	        try {

	            const res = await fetch(`/gruppovendite/checkAvailabilityOnBin/${numBins}/${arriviSelect}`);
	            const data = await res.json();
	            console.log(data);
	            const available = data.available || 0;
	            const check = data.check || 0;

	            availabilityMsg.innerText ="";
	            numBinsH.classList.remove("is-invalid");
	            
	            if( check && !available){
	            availabilityMsg.innerText =
                    "dati non validi ";
	            numBinsH.classList.add("is-invalid");
	            }
	            
// 	            if (requested > available) {

// 	                availabilityMsg.innerText =
// 	                    "Disponibili solo " + available;

// 	                numBins.classList.add("is-invalid");

// 	            } else {

// 	                availabilityMsg.innerText =
// 	                    "Disponibili: " + available;

// 	                numBins.classList.remove("is-invalid");
// 	            }

	        } catch (e) {
	        	 console.log(e);
	            availabilityMsg.innerText =
	                "Errore verifica disponibilità";
	        }
	    }

	    function aggiornaTotali() {

	        let totaleQta = 0;
	        let totaleLordo = 0;
	        let totaleNetto = 0;
	        let totaleTara = 0;
	        let totaleImporto=0;
console.log("aggiornaTotali");
	        document.querySelectorAll(".bin-row").forEach(row => {

	            const qty = Number(row.querySelector(".numBins")?.value) || 0;
	            const lordo = Number(row.querySelector(".pesoLordo")?.value) || 0;
	            const netto = Number(row.querySelector(".pesoNetto")?.value) || 0;
	            const scarto = Number(row.querySelector(".scarto")?.value) || 0;
	            const prezzo = Number(row.querySelector(".prezzo")?.value) || 0;
	            
	            const importo = lordo * prezzo*(1-scarto/100);
	            totaleImporto+=importo;
	            
	            row.querySelector(".importo").value= importo;

	            totaleQta += qty;
	            totaleLordo += lordo;
	            totaleNetto += netto;

	            totaleTara += (lordo - netto);
	        });
 	        const importoGen = document.getElementById("importo");
 	        importoGen.value= totaleImporto;
	        // ===== INPUT REFERENCES =====
	        const lordoInput = document.querySelector('[name="peso_lordo"]');
	        const nettoTaraInput = document.querySelector('[name="nettoDiTara"]');
	        const nettoScartoInput = document.querySelector('[name="nettoDiScarto"]');
	        const scartoInput = document.getElementById("scarto");
	     

	        const prezzoFrigoCaldoInput = document.getElementById("prezzoFrigoxCaldo");
	        const prezzoFrigoFreddoInput = document.getElementById("prezzoFrigoxFreddo");

	        // ===== SAFE PARSE =====
	     
	        const scartoPerc = Number(scartoInput?.value) || 0;

	        const prezzoCaldo = Number(prezzoFrigoCaldoInput?.value) || 0;
	        const prezzoFreddo = Number(prezzoFrigoFreddoInput?.value) || 0;

	        // ===== TOTALI =====
	        if (lordoInput) {
	            lordoInput.value = totaleLordo.toFixed(2);
	        }

	        if (nettoTaraInput) {
	            nettoTaraInput.value = totaleNetto.toFixed(2);
	        }

	        // ===== NETTO SCONTATO =====
	        const nettoDiScarto = totaleNetto * (1 - scartoPerc / 100);

	        if (nettoScartoInput) {
	            nettoScartoInput.value = nettoDiScarto.toFixed(2);
	        }

	        // ===== IMPORTO =====
	     

	    

	        // ===== FRIGO =====
	        const baseFrigo = totaleLordo - (totaleTara / 2);

	        const frigoxCaldo = baseFrigo * prezzoCaldo;
	        const frigoxFreddo = baseFrigo * prezzoFreddo;

	        const frigoxCaldoInput = document.getElementById("frigoxCaldo");
	        const frigoxFreddoInput = document.getElementById("frigoxFreddo");

	        if (frigoxCaldoInput) {
	            frigoxCaldoInput.value = frigoxCaldo.toFixed(2);
	        }

	        if (frigoxFreddoInput) {
	            frigoxFreddoInput.value = frigoxFreddo.toFixed(2);
	        }

	        // ===== COUNT BINS =====
	        const nBinsInput = document.getElementById("nBins");
	        if (nBinsInput) {
	            nBinsInput.value = totaleQta;
	        }
	        
	        const pesoLordo = document.getElementById("pesoLordo");
	        if( pesoLordo.value == 0){
	        	pesoLordo.value='';
	        }
	    }
	    function calcImporto() {

	 
	  
	    }
	    function aggiornaPesi(row) {

	        const qta = Number(row.querySelector('.numBins')?.value) || 0;
	        const binId = row.querySelector('.binSelect')?.value;

	        const bin = binsList.find(b => String(b.id) === String(binId));

	        if (!bin || qta <= 0) {
	            row.querySelector('.pesoLordo').value = "";
	            row.querySelector('.pesoNetto').value = "";
	            aggiornaTotali();
	            return;
	        }

	        const lordoUnitario = Number(bin.pesoLordo ?? 0);
	        const tara = Number(bin.tara ?? 0);

	        const lordo = lordoUnitario * qta;
	        const netto = (lordoUnitario - tara) * qta;

	        row.querySelector('.pesoLordo').value = lordo.toFixed(2);
	        row.querySelector('.pesoNetto').value = netto.toFixed(2);
	        
	        if ( lordo == 0 ) // Voglio vedre il campo a blank, non 0.00
	        	row.querySelector('.pesoLordo').value = "";
	        
	        aggiornaTotali();
	    }
	    	
	    function addBin() {

	        const container = document.getElementById("binsContainer");

	        let options = `<option value="">Seleziona Bin</option>`;
	        binsList.forEach(b => {
	            options += `<option value="${b.id}">${b.name}</option>`;
	        });
	        
	        let arrivi = `<option value="">Seleziona arrivo</option>`;
	        arriviList.forEach(b => {
	        	arrivi += `<option value="${b.id}">${b.name}</option>`;
	        });
	        let merce = `<option value="">Seleziona merce</option>`;
	        merceList.forEach(b => {
	        	merce += `<option value="${b.id}">${b.name}</option>`;
	        });

	        const html = `
	        <div class="row mb-3 bin-row">

	            <div class="col-md-2">
	                <input type="number"
	                       class="form-control numBins"
	                       min="1"
	                       placeholder="Qta">
	            </div>

	            <div class="col-md-3">
	                <select class="form-select binSelect">
	                    ${options}
	                </select>
	            </div>
	            <div class="col-md-3">
          		 <select class="form-select merceSelect">
             	  ${merce}
          		 </select>
      		 </div>
	            <div class="col-md-2">
                <input type="number" step="0.001"
                       class="form-control prezzo"
                       min="1"
                       placeholder="prezzo">
            </div>

	            <div class="col-md-2">
	                <input type="number" class="form-control pesoLordo" 
	                	  placeholder="pesoLordo">
	            </div>

	            <div class="col-md-2">
	                <input type="number" class="form-control pesoNetto" 
	                	  placeholder="pesoNetto">
	            </div>
	            
	            <div class="col-md-2">
                <input type="number" step="0.001"
                       class="form-control scarto"
                       min="1"
                       placeholder="scarto">
            </div>
	            
	           
            <div class="col-md-2">
            <input type="number" step="0.01"
                   class="form-control importo"
                   min="0"
                   placeholder="importo">
        </div>
	            
	            <div class="col-md-3">
                <select class="form-select arriviSelect" required>
                    ${arrivi}
                </select>
          	  </div>
          
       		 
       		<div class="col-sm-3">
       		
            <select class="form-select nostraProprieta" >
                <option value="">-- Seleziona proprietà --</option>

                <option value="1">NOSTRA</option>
                <option value="0">VOSTRA</option>
              
         
            </select>
        </div>

	            <div class="col-md-3">
	                <div class="availabilityMsg text-danger small"></div>
	            </div>

	            <div class="col-md-1">
	                <button type="button" class="btn btn-danger btn-sm removeBtn">X</button>
	            </div>

	        </div>`;

	        container.insertAdjacentHTML("beforeend", html);

	        const row = container.lastElementChild;
	
	        const numBins = row.querySelector(".numBins");
	        const binSelect = row.querySelector(".binSelect");
	        const btnRemove = row.querySelector(".removeBtn");
	        const pesoLordo = row.querySelector(".pesoLordo");
	        
	        function handler() {
	            aggiornaPesi(row);
	            checkAvailability(row); 
	            aggiornaArrivi(row);
	        }

	        numBins.addEventListener("input", handler);
	        binSelect.addEventListener("change", handler);

	        btnRemove.addEventListener("click", () => {
	            row.remove();
	            aggiornaTotali();
	            aggiornaArrivi(row);
	        });

	        index++;
	     
	        pesoLordo.addEventListener("input", function () {
	            aggiornaPesoDaLordo(row);
	            aggiornaTotali();
	        });
	        
	        const merceSelect = row.querySelector(".merceSelect");
	        merceSelect.addEventListener("change", handler);

	        const arriviSelect = row.querySelector(".arriviSelect");
	        arriviSelect.addEventListener("change", () => checkAvailability(row));
	    
	    }
	    function removeRow(btn) {

	        btn.closest(".bin-row").remove();

	        aggiornaTotali();
	    }
	    document.getElementById("venditaForm")
	    .addEventListener("submit", function(e){

	        if(document.querySelectorAll(".bin-row").length === 0){
	            e.preventDefault();
	            alert("Inserire almeno un bin");
	            return;
	        }
	        const invalid =
		        document.querySelector(".numBins.is-invalid");

		    if(invalid){
		        e.preventDefault();
		        alert("Quantità non disponibile");
		        return;
		    }
		    const     invalid1 = Array.from(document.querySelectorAll(".pesoLordo"))
	        .some(i => Number(i.value) <= 0);

	    if (invalid1) {
	        e.preventDefault();
	        alert("Il peso lordo deve essere maggiore di 0 per ogni bin");
	        return;
	    }
	    });
	    
	    
	    
	
	    
	    
	    document.addEventListener("DOMContentLoaded", function () {

	      
	    });
	    document.getElementById("venditaForm").addEventListener("submit", function () {

	        const rows = document.querySelectorAll(".bin-row");

	        const bins = [];
	        
	       const commerciante= document.getElementById("commercianteId").value;

	        rows.forEach(row => {

	            const binId = row.querySelector(".binSelect").value;
	            const numBins = parseInt(row.querySelector(".numBins").value) || 0;
	            const arriviSelect = row.querySelector(".arriviSelect").value;
	            
	            

	            const pesoLordo = parseFloat(row.querySelector(".pesoLordo").value) || 0;
	            const pesoNetto = parseFloat(row.querySelector(".pesoNetto").value) || 0;
	            const prezzo = parseFloat(row.querySelector(".prezzo").value) || 0
	            const scarto = parseFloat(row.querySelector(".scarto").value) || 0;
	         //   var importo = row.querySelector(".importo");
	            const importo = pesoLordo*prezzo*(1-scarto/100);
	     
	            
	            const nostraProprieta = parseInt(row.querySelector(".nostraProprieta").value) || 0;

	            if (binId && numBins > 0) {
	                bins.push({
	                    binId,
	                    numBins,
	                    pesoLordo,
	                    pesoNetto,
	                    commerciante,
	                    scarto,
	                    prezzo,
	                    importo,
	                    nostraProprieta,
	                    arriviSelect
	                });
	            }
	        });

	        document.getElementById("binsJson").value = JSON.stringify(bins);
	        document.getElementById("arriviJson").value = JSON.stringify(bins);
	    });
	    function aggiornaPesoDaLordo(row) {

	        const qta = Number(row.querySelector('.numBins')?.value) || 0;
	        const binId = row.querySelector('.binSelect')?.value;

	        const bin = binsList.find(b => String(b.id) === String(binId));

	        if (!bin || qta <= 0) return;

	        const tara = Number(bin.tara) || 0;

	        const lordo = Number(row.querySelector('.pesoLordo')?.value) || 0;
	        
	        var netto = 0;
	        
	        if( lordo > 0)
	         netto = lordo - (tara * qta);

	        row.querySelector('.pesoNetto').value = netto.toFixed(2);
	    }
</script>
