<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuovo Arrivo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">Inserisci Arrivo</h1>

    <form th:action="@{/web/arrivi/save}"
          th:object="${arrivo}"
          method="post">

        <!-- DATA -->



        <!-- DATA -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Data</label>
            <div class="col-sm-9">
                <input type="date"
                       th:field="*{data}"
                       class="form-control">
            </div>
        </div>

        <!-- MERCE -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Merce</label>
            <div class="col-sm-9">
                <input type="text"
                       th:field="*{merce}"
                       class="form-control"
                       placeholder="Merce">
            </div>
        </div>

        <!-- PESO LORDO -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Peso Lordo</label>
            <div class="col-sm-9">
                <input type="number"
                       th:field="*{peso_lordo}"
                       class="form-control"
                       placeholder="Peso lordo">
            </div>
        </div>

        <!-- PESO NETTO -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Peso Netto</label>
            <div class="col-sm-9">
                <input type="number"
                       th:field="*{peso_netto}"
                       class="form-control"
                       placeholder="Peso netto">
            </div>
        </div>

        <!-- FREDDO -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Tipo</label>
            <div class="col-sm-9">
                <select th:field="*{freddo}" class="form-control">
                    <option value="1">Freddo</option>
                    <option value="0">Caldo</option>
                </select>
            </div>
        </div>
 <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Calo</label>
            <div class="col-sm-9">
                <input type="number"
                       th:field="*{calo}"
                       class="form-control"
                       placeholder="Calo">
            </div>
        </div>
        <!-- INTESTAZIONE -->
        <div class="row mb-3 align-items-center">
            <label class="col-sm-3 col-form-label">Intestazione</label>
            <div class="col-sm-9">
                <input type="text"
                       th:field="*{intestazione_merce}"
                       class="form-control"
                       placeholder="Intestazione">
            </div>
        </div>
        <hr>

        <h4>Bins</h4>

        <!-- CONTAINER BINS -->
        <div id="binsContainer"></div>

        <!-- BOTTONE AGGIUNGI -->
        <button type="button" class="btn btn-primary mt-2" onclick="addBin()">
            + Aggiungi Bin
        </button>

        <hr>

        <button type="submit" class="btn btn-success">
            Salva Arrivo
        </button>

    </form>

</div>

<script th:inline="javascript">

let index = document.querySelectorAll('#binsContainer .row').length;

    // lista bin dal backend
    const binsList = /*[[${binsList}]]*/ [];

    function addBin() {

        const container = document.getElementById("binsContainer");

        let options = `<option value="">Seleziona Bin</option>`;

        binsList.forEach(b => {
            options += `<option value="${b.id}">${b.name}</option>`;
        });

        const html = `
        <div class="row mb-2 border p-2">

            <div class="col-md-5">
                <input type="number"
                       name="bins[${index}].numBins"
                       class="form-control"
                       placeholder="Numero bins">
            </div>

            <div class="col-md-5">
                <select name="bins[${index}].bin.id"
                        class="form-control">
                    ${options}
                </select>
            </div>

            <div class="col-md-2">
                <button type="button"
                        class="btn btn-danger"
                        onclick="this.parentElement.parentElement.remove()">
                    X
                </button>
            </div>

        </div>`;

        container.insertAdjacentHTML("beforeend", html);

        index++;
    }

</script>

</body>
</html>
