<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuovo Arrivo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">Inserisci Arrivo</h1>

    <form th:action="@{/web/arrivi/save}" th:object="${arrivo}" method="post">

        <!-- DATA -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Data</label>
            <div class="col-sm-9">
                <input type="date" th:field="*{data}" class="form-control" required>
            </div>
        </div>

        <!-- MERCE -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Merce</label>
            <div class="col-sm-9">
                <select class="form-select" th:field="*{merce}" required>
                    <option value="">-- Seleziona Merce --</option>
                    <option th:each="c : ${listamerce}"
                            th:value="${c.merce_id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>
        </div>

        <h5>Bins</h5>

        <div id="binsContainer"></div>

        <button type="button" class="btn btn-primary mb-3" onclick="addBin()">
            + Aggiungi Bin
        </button>

        <!-- TOTALI -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Peso Lordo</label>
            <div class="col-sm-9">
                <input type="number" th:field="*{peso_lordo}" class="form-control" readonly>
            </div>
        </div>

        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Peso Netto</label>
            <div class="col-sm-9">
                <input type="number" th:field="*{peso_netto}" class="form-control" readonly>
            </div>
        </div>

        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Calo</label>
            <div class="col-sm-9">
                <input type="number" th:field="*{calo}" class="form-control" readonly>
            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Salva Arrivo
        </button>

    </form>

</div>

<script th:inline="javascript">

let index = 0;
const binsList = /*[[${binsList}]]*/ [];
console.log(binsList);
function aggiornaTotali() {

    let totaleLordo = 0;
    let totaleNetto = 0;

    document.querySelectorAll('.bin-row').forEach(row => {

        totaleLordo += Number(row.querySelector('.pesoLordo')?.value) || 0;
        totaleNetto += Number(row.querySelector('.pesoNetto')?.value) || 0;
    });

    document.querySelector('[name="peso_lordo"]').value = totaleLordo.toFixed(2);
    document.querySelector('[name="peso_netto"]').value = totaleNetto.toFixed(2);

    document.querySelector('[name="calo"]').value =
        (totaleLordo - totaleNetto).toFixed(2);
}

function aggiornaPesi(el) {

    const row = el.closest('.bin-row');
    if (!row) return;

    const qta = Number(row.querySelector('.numBins')?.value) || 0;
    const binId = row.querySelector('.binSelect')?.value;

    const bin = binsList.find(b => String(b.id) === String(binId));

    if (!bin || qta <= 0) {
        row.querySelector('.pesoLordo').value = "";
        row.querySelector('.pesoNetto').value = "";
        aggiornaTotali();
        return;
    }

    const lordoUnitario = Number(bin.pesoLordo) || 0;
    const tara = Number(bin.tara) || 0;

    const lordo = lordoUnitario * qta;
    const netto = (lordoUnitario - tara) * qta;

    row.querySelector('.pesoLordo').value = lordo.toFixed(2);
    row.querySelector('.pesoNetto').value = netto.toFixed(2);

    aggiornaTotali();
}

function addBin() {

    const container = document.getElementById("binsContainer");

    let options = `<option value="">Seleziona Bin</option>`;
    binsList.forEach(b => {
        options += `<option value="${b.id}">${b.name}</option>`;
    });

    const html = `
    <div class="row mb-3 bin-row align-items-center">

        <div class="col-md-2">
            <input type="number"
                   name="bins[${index}].numBins"
                   class="form-control numBins"
                   min="1"
                   placeholder="Qta"
                   oninput="aggiornaPesi(this)">
        </div>

        <div class="col-md-3">
            <select name="bins[${index}].bin.id"
                    class="form-select binSelect"
                    onchange="aggiornaPesi(this)">
                ${options}
            </select>
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoLordo" readonly>
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoNetto" readonly>
        </div>

        <div class="col-md-3">
            <button type="button" class="btn btn-danger" onclick="removeRow(this)">
                X
            </button>
        </div>

    </div>`;

    container.insertAdjacentHTML("beforeend", html);
    index++;
}

function removeRow(btn) {
    btn.closest('.bin-row').remove();
    aggiornaTotali();
}

</script>

</body>
</html>
