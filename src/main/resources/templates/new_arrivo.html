<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuovo Arrivo</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h1 class="text-center mb-4">Inserisci Arrivo</h1>

		<form th:action="@{/web/arrivi/save}" th:object="${arrivo}"
			method="post">

			<!-- DATA -->



			<!-- DATA -->
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Data</label>
				<div class="col-sm-9">
					<input type="date" th:field="*{data}" class="form-control">
				</div>
			</div>

			<!-- MERCE -->

			<div class="row mb-3 align-items-center">

    <label class="col-sm-3 col-form-label">
        Merce
    </label>

    <div class="col-sm-9">

        <select class="form-select"
                th:field="*{merce.merce_id}"
                required>

            <option value="">
                -- Seleziona Merce --
            </option>

            <option th:each="c : ${listamerce}"
                    th:value="${c.merce_id}"
                    th:text="${c.name}">
            </option>

        </select>

    </div>

</div>

			<h4>Bins</h4>

			<!-- CONTAINER BINS -->
			<div id="binsContainer"></div>

			<!-- BOTTONE AGGIUNGI -->
			<button type="button" class="btn btn-primary mt-2" onclick="addBin()">
				+ Aggiungi Bin</button>


			<!-- PESO LORDO -->
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Peso Lordo</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{peso_lordo}" class="form-control"
						placeholder="Peso lordo">
				</div>
			</div>

			<!-- PESO NETTO -->
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Peso Netto</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{peso_netto}" class="form-control"
						placeholder="Peso netto">
				</div>
			</div>

			<!-- FREDDO -->
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Tipo</label>
				<div class="col-sm-9">
					<select th:field="*{freddo}" class="form-control">
						<option value="1">Freddo</option>
						<option value="0">Caldo</option>
					</select>
				</div>
			</div>
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Calo</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{calo}" class="form-control"
						placeholder="Calo">
				</div>
			</div>
			<!-- INTESTAZIONE -->
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Intestazione</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{intestazione_merce}"
						class="form-control" placeholder="Intestazione">
				</div>
			</div>
			<hr>


			<hr>

			<button type="submit" class="btn btn-success">Salva Arrivo</button>

		</form>

	</div>

<script th:inline="javascript">

let index = 0;

const binsList = /*[[${binsList}]]*/ [];

function aggiornaPesi(element) {

    const row = element.closest('.bin-row');

    const quantita = parseInt(row.querySelector('.numBins').value) || 0;
    const binId = parseInt(row.querySelector('.binSelect').value);

    if (!binId) return;

    const bin = binsList.find(b => b.id == binId);
    if (!bin) return;

    const lordo = (bin.peso_lordo || 0) * quantita;
    const netto = ((bin.peso_lordo || 0) - (bin.tara || 0)) * quantita;

    row.querySelector('.pesoLordo').value = lordo;
    row.querySelector('.pesoNetto').value = netto;

    aggiornaTotali();
}

function aggiornaTotali() {

    let totaleLordo = 0;
    let totaleNetto = 0;

    document.querySelectorAll('.bin-row').forEach(row => {

        const lordo = parseInt(row.querySelector('.pesoLordo').value) || 0;
        const netto = parseInt(row.querySelector('.pesoNetto').value) || 0;

        totaleLordo += lordo;
        totaleNetto += netto;
    });

    document.querySelector('[name="peso_lordo"]').value = totaleLordo;
    document.querySelector('[name="peso_netto"]').value = totaleNetto;
    document.querySelector('[name="calo"]').value = totaleLordo - totaleNetto;
}

function addBin() {

    const container = document.getElementById("binsContainer");

    let options = `<option value="">Seleziona Bin</option>`;

    binsList.forEach(b => {
        options += `<option value="${b.id}">${b.name}</option>`;
    });

    const html = `
    <div class="row mb-2 border p-2 bin-row align-items-center">

        <div class="col-md-2">
            <input type="number"
                name="bins[${index}].numBins"
                class="form-control numBins"
                min="1"
                placeholder="Qta"
                oninput="aggiornaPesi(this)">
        </div>

        <div class="col-md-3">
            <select name="bins[${index}].bin"
                    class="form-control binSelect"
                    onchange="aggiornaPesi(this)">
                ${options}
            </select>
        </div>

        <div class="col-md-2">
            <input type="number"
                   name="bins[${index}].pesoLordo"
                   class="form-control pesoLordo"
                	   oninput="aggiornaTotali()"
                   >
        </div>

        <div class="col-md-2">
            <input type="number"
                   name="bins[${index}].pesoNetto"
                   class="form-control pesoNetto"
                	   oninput="aggiornaTotali()"
                   >
        </div>

        <div class="col-md-2">
            <button type="button"
                    class="btn btn-danger"
                    onclick="removeRow(this)">
                X
            </button>
        </div>

    </div>`;

    container.insertAdjacentHTML("beforeend", html);

    index++;
}

function removeRow(button) {
    button.closest('.bin-row').remove();
    aggiornaTotali();
}
</script>

</body>
</html>
