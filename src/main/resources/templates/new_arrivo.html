<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuovo Arrivo</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>
<div th:replace="navbar :: navbar"></div>
	<div class="container mt-4">

		<h1 class="text-center mb-4">Inserisci Arrivo</h1>
		<p th:if="${msg}" th:text="${msg}"></p>
		<form th:action="@{/web/arrivi/save}" th:object="${arrivo}"
			method="post">
			
		 <input
				type="hidden" name="prezzoFrigoxFreddo" id="prezzoFrigoxFreddo"
				th:value="${configurazione.prezzoFrigoxFreddo}"> <input
				type="hidden" name="prezzoFrigoxCaldo" id="prezzoFrigoxCaldo"
				th:value="${configurazione.prezzoFrigoxCaldo}">

			<!-- DATA -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Data</label>
				<div class="col-sm-9">
					<input type="date" th:field="*{data}" class="form-control" required>
				</div>
			</div>

			<!-- MERCE -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Merce</label>
				<div class="col-sm-9">
					<select class="form-select" th:field="*{merce}" required>
						<option value="">-- Seleziona Merce --</option>
						<option th:each="c : ${listamerce}" th:value="${c.merce_id}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>

			<h5>Bins</h5>

			<div id="binsContainer"></div>

			<button type="button" class="btn btn-primary mb-3" onclick="addBin()">
				+ Aggiungi Bin</button>

			<!-- TOTALI -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Lordo</label>
				<div class="col-sm-9">
					<input type="number"  id="pesoLordo"th:field="*{peso_lordo}" class="form-control"
						readonly>
				</div>
			</div>

			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Netto</label>
				<div class="col-sm-9">
					<input type="number" id="pesoNetto" th:field="*{peso_netto}" class="form-control"
						readonly>
				</div>
			</div>


			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Media</label>
				<div class="col-sm-9">
					<input type="number"      step="0.01"
                                   min="0" th:field="*{media}" class="form-control">
				</div>
			</div>

			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">C/F</label>

				<div class="col-sm-9">
					<select th:field="*{freddo}" class="form-select" name="CF" id="CF">
						<option th:value="0">Caldo</option>
						<option th:value="1">Freddo</option>
					</select>
				</div>
			</div>
			
			<div class="row mb-3 align-items-center">
    <label class="col-sm-3 col-form-label">Pago Frigo</label>

    <div class="col-sm-9">
        <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   th:field="*{pagoFrigo}">
            <label class="form-check-label">
                Pago Frigo
            </label>
        </div>
    </div>
</div>

			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Frigo per Caldo</label>
				<div class="col-sm-9">
					<input th:field="*{frigoxCaldo}" type="number" step="0.01" name="frigoxCaldo"
						id="frigoxCaldo" class="form-control">
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Frigo per Freddo</label>
				<div class="col-sm-9">
					<input th:field="*{frigoxFreddo}" type="number" step="0.01" name="frigoxFreddo"
						id="frigoxFreddo" class="form-control">
				</div>
			</div>

			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Intestazione</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{intestazione_merce}"
						class="form-control">
				</div>
			</div>

			<button type="submit" class="btn btn-success">Salva Arrivo</button>

		</form>

	</div>

	<script th:inline="javascript">
	
	document.getElementById("CF")
	.addEventListener("change", async function () {

	
		 aggiornaFrigo();
		 setFrigo();
		 
	});
	
	function setFrigo(){
		const cf = document.getElementById("CF").value;
		
		if( cf == 0){ // Caldo
	
			document.getElementById("frigoxFreddo").value=0;
		}
		else{
			document.getElementById("frigoxCaldo").value=0;
		}
	}


let index = 0;
const binsList = /*[[${binsList}]]*/ [];
console.log(binsList);

function aggiornaTotali() {

    let totaleLordo = 0;
    let totaleNetto = 0;
    let totaleBins = 0;

    document.querySelectorAll('.bin-row').forEach(row => {

        const qta = Number(row.querySelector('.numBins')?.value) || 0;
        const lordo = Number(row.querySelector('.pesoLordo')?.value) || 0;
        const netto = Number(row.querySelector('.pesoNetto')?.value) || 0;

        totaleBins += qta;
        totaleLordo += lordo;
        totaleNetto += netto;

        // media della singola riga
        if (qta > 0) {
            row.querySelector('.media').value = (lordo / qta).toFixed(2);
        }
    });

    document.getElementById("pesoLordo").value = totaleLordo.toFixed(2);
    document.getElementById("pesoNetto").value = totaleNetto.toFixed(2);

    // media complessiva
    const mediaTotale = totaleBins > 0 ? totaleLordo / totaleBins : 0;

    document.querySelector('[name="media"]').value =
        mediaTotale.toFixed(2);

    aggiornaFrigo();
}
function aggiornaTotali_old() {

    let totaleLordo = 0;
    let totaleNetto = 0;
    let numBin=0;
    let media=0;

    document.querySelectorAll('.bin-row').forEach(row => {
    	
    	numBin=Number(row.querySelector('.media')?.value) || 0
    	if( numBin>0){
    		media = (Number(row.querySelector('.pesoLordo')?.value) || 0 )/ numBin;
    		row.querySelector('.media').value=media;
    	}

        totaleLordo += Number(row.querySelector('.pesoLordo')?.value) || 0;
        totaleNetto += Number(row.querySelector('.pesoNetto')?.value) || 0;
    });

    document.querySelector('[name="peso_lordo"]').value = totaleLordo.toFixed(2);
    document.querySelector('[name="peso_netto"]').value = totaleNetto.toFixed(2);


    
    aggiornaFrigo();
}

function aggiornaFrigo(){
    const prezzoFrigoCaldoInput = document.getElementById("prezzoFrigoxCaldo");
    const prezzoFrigoFreddoInput = document.getElementById("prezzoFrigoxFreddo");
    const prezzoCaldo = Number(prezzoFrigoCaldoInput?.value) || 0;
    const prezzoFreddo = Number(prezzoFrigoFreddoInput?.value) || 0;
    
	const totaleLordo = document.getElementById("pesoLordo").value;
	const totaleNetto = document.getElementById("pesoNetto").value;
	const totaleTara = totaleLordo - totaleNetto;
	const baseFrigo = totaleLordo - (totaleTara / 2);
	
	  const frigoxCaldo = baseFrigo * prezzoCaldo;
      const frigoxFreddo = baseFrigo * prezzoFreddo;
      
      const frigoxCaldoInput = document.getElementById("frigoxCaldo");
      const frigoxFreddoInput = document.getElementById("frigoxFreddo");
      if (frigoxCaldoInput) {
          frigoxCaldoInput.value = frigoxCaldo.toFixed(2);
      }

      if (frigoxFreddoInput) {
          frigoxFreddoInput.value = frigoxFreddo.toFixed(2);
      }
}

function aggiornaPesi(el) {

    const row = el.closest('.bin-row');
    if (!row) return;

    const qta = Number(row.querySelector('.numBins')?.value) || 0;
    const binId = row.querySelector('.binSelect')?.value;

    const bin = binsList.find(b => String(b.id) === String(binId));

    if (!bin || qta <= 0) {
        row.querySelector('.pesoLordo').value = "";
        row.querySelector('.pesoNetto').value = "";
        aggiornaTotali();
        return;
    }

    const lordoUnitario = Number(bin.pesoLordo) || 0;
    const tara = Number(bin.tara) || 0;

    const lordo = lordoUnitario * qta;
    const netto = (lordoUnitario - tara) * qta;
    
    const media = lordo / qta ;
    document.querySelector('[name="media"]').value = media.toFixed(2);

    row.querySelector('.pesoLordo').value = lordo.toFixed(2);
    row.querySelector('.pesoNetto').value = netto.toFixed(2);
    
    if ( lordo == 0 ) // Voglio vedre il campo a blank, non 0.00
    	row.querySelector('.pesoLordo').value = "";

    aggiornaTotali();
    
    setFrigo();
}
function aggiornaPesoNetto(el) {

    const row = el.closest('.bin-row');
    if (!row) return;

    const qta = Number(row.querySelector('.numBins')?.value) || 0;
    const binId = row.querySelector('.binSelect')?.value;

    const bin = binsList.find(b => String(b.id) === String(binId));

    if (!bin || qta <= 0) {
        aggiornaTotali();
        return;
    }

    const tara = Number(bin.tara) || 0;

    const lordo = Number(row.querySelector('.pesoLordo').value) || 0;

    const netto = lordo - (tara * qta);

    row.querySelector('.pesoNetto').value = netto.toFixed(2);

    document.querySelector('[name="media"]').value =
        (lordo / qta).toFixed(2);

    aggiornaTotali();
}
function addBin() {

    const container = document.getElementById("binsContainer");

    let options = `<option value="">Seleziona Bin</option>`;
    binsList.forEach(b => {
        options += `<option value="${b.id}">${b.name}</option>`;
    });

    const html = `
    <div class="row mb-3 bin-row align-items-center">

        <div class="col-md-2">
            <input type="number"
                   name="bins[${index}].numBins"
                   class="form-control numBins"
                   min="1"
                   placeholder="Qta"
                   oninput="aggiornaPesi(this)">
        </div>

        <div class="col-md-3">
            <select name="bins[${index}].bin.id"
                    class="form-select binSelect"
                    onchange="aggiornaPesi(this)">
                ${options}
            </select>
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoLordo" step="0.01"
            	  placeholder="pesoLordo"
            	name="bins[${index}].pesoLordo"
            		oninput="aggiornaDaLordo(this)">
        </div>

        <div class="col-md-2">
            <input type="number" class="form-control pesoNetto" step="0.01"
            	  placeholder="pesoNetto"
            	name="bins[${index}].pesoNetto"
            onchange="aggiornaTotali()">
        </div>
        <div class="col-md-2">
        <input type="number" class="form-control media" step="0.01"
        	placeholder="media"
        	name="bins[${index}].media"
        onchange="aggiornaTotali()">
    </div>

        <div class="col-md-3">
            <button type="button" class="btn btn-danger" onclick="removeRow(this)">
                X
            </button>
        </div>

    </div>`;

    container.insertAdjacentHTML("beforeend", html);
    index++;
}
function aggiornaDaLordo(el) {

    const row = el.closest('.bin-row');
    if (!row) return;

    const qta = Number(row.querySelector('.numBins')?.value) || 0;
    const binId = row.querySelector('.binSelect')?.value;

    const bin = binsList.find(b => String(b.id) === String(binId));

    if (!bin || qta <= 0) {
        row.querySelector('.pesoNetto').value = "";
        aggiornaTotali();
        return;
    }

    const tara = Number(bin.tara) || 0;
    const lordo = Number(el.value) || 0;

    // 🔥 NETTO CORRETTO
    const netto = lordo - (tara * qta);

    row.querySelector('.pesoNetto').value = netto.toFixed(2);

    // opzionale: media
    document.querySelector('[name="media"]').value =
        (lordo / qta).toFixed(2);

    aggiornaTotali();
    setFrigo();
}
function removeRow(btn) {
    btn.closest('.bin-row').remove();
    aggiornaTotali();
}

</script>

</body>
</html>
