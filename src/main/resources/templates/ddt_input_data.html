<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Info per DDT</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h1 class="text-center mb-4">Inserisci Arrivo</h1>

		<form th:action="@{/web/arrivi/save}" th:object="${ddtInputData}"
			method="post">

			<!-- DATA -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Data</label>
				<div class="col-sm-9">
					<input type="date" th:field="*{data}" class="form-control" required>
				</div>
			</div>

			<!-- MERCE -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Merce</label>
				<div class="col-sm-9">
					<select class="form-select" th:field="*{merce}" required>
						<option value="">-- Seleziona Merce --</option>
						<option th:each="c : ${listamerce}" th:value="${c.merce_id}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>

			<h5>Bins</h5>

			<div id="binsContainer"></div>

			<button type="button" class="btn btn-primary mb-3" onclick="addBin()">
				+ Aggiungi Bin</button>

			<!-- TOTALI -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Lordo</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{peso_lordo}" class="form-control"
						readonly>
				</div>
			</div>

			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Netto</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{peso_netto}" class="form-control"
						readonly>
				</div>
			</div>

			
			<div class="row mb-3"> <label class="col-sm-3 col-form-label">Media</label>
			<div class="col-sm-9">
				<input type="number" th:field="*{media}" class="form-control">
			</div>
	</div>

	<div class="row mb-3 align-items-center">
		<label class="col-sm-3 col-form-label">C/F</label>

		<div class="col-sm-9">
			<select th:field="*{freddo}" class="form-select">
				<option th:value="0">Caldo</option>
				<option th:value="1">Freddo</option>
			</select>
		</div>
	</div>

	<div class="row mb-3">
		<label class="col-sm-3 col-form-label">Intestazione</label>
		<div class="col-sm-9">
			<input type="text" th:field="*{intestazione_merce}"
				class="form-control">
		</div>
	</div>

	<button type="submit" class="btn btn-success">Salva Arrivo</button>

	</form>

	</div>



</body>
</html>
