<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Info per DDT</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h1 class="text-center mb-4">DDT</h1>

		<form th:action="@{/ddt/vendite/selezionate1}" th:object="${ddtInputData}"
			method="post">

 <input type="hidden" th:field="*{commercianteId}">

    <div th:each="id, stat : *{ids}">
        <input type="hidden"
               th:field="*{ids[__${stat.index}__]}">
    </div>

			<!-- DATA -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Trasporto a mezzo</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{trasportoAmezzo}"
						class="form-control" required>
				</div>
			</div>
			
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Luogo di destinazione</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{luogoDiDestinazione}"
						class="form-control" required>
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Categoria</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{categoria}"
						class="form-control" required>
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Aspetto esteriore</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{aspettoEsteriore}"
						class="form-control" required>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label">Trasportatore</label> <select
					name="trasportatoreId" class="form-select" required>
					<option value="">-- Seleziona Trasportatore --</option>
					<option th:each="c : ${trasportatori}"
						th:value="${c.id}" th:text="${c.name}"></option>
				</select>
			</div>



			<button type="submit" class="btn btn-success">Salva Arrivo</button>

		</form>

	</div>



</body>
</html>
