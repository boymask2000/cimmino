<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Info per DDT</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>
<div th:replace="navbar :: navbar"></div>
	<div class="container mt-4">

		<h1 class="text-center mb-4">DDT</h1>

		<form th:action="@{/ddt/vendite/selezionate1}"
			th:object="${ddtInputData}" method="post">

			<input type="hidden" th:field="*{commercianteId}">

			<div th:each="id, stat : *{ids}">
				<input type="hidden" th:field="*{ids[__${stat.index}__]}">
			</div>
			
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Titolare</label>

				<div class="col-sm-9">
					<select name="titolareId" class="form-select" required>
						<option value="">-- Seleziona Titolare --</option>
						<option th:each="c : ${titolari}" th:value="${c.id}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>
			
			<div class="row mb-3">
    <label class="col-sm-3 col-form-label">Num. DDT</label>

    <div class="col-sm-9">
        <input type="text"
               th:field="*{numeroDDT}"
               id="numeroDDT"
               class="form-control"
               required>

        <small id="ddtMessage" class="form-text"></small>
    </div>
</div>


<div class="row mb-3 align-items-center">
    <label class="col-sm-3 col-form-label">Trasporto a mezzo</label>

    <div class="col-sm-9">
        <select th:field="*{trasportoAmezzo}" class="form-select" required>
            <option value="">-- Seleziona mezzo di trasporto --</option>

            <option value="VETTORE">VETTORE</option>
            <option value="CEDENTE">CEDENTE</option>
            <option value="CONCESSIONARIO">CONCESSIONARIO</option>
     
        </select>
    </div>
</div>
<div class="row mb-3 align-items-center">
    <label class="col-sm-3 col-form-label">Tipo peso</label>

    <div class="col-sm-9">
        <select th:field="*{tipoPeso}" class="form-select" required>
            <option value="0">LORDO</option>
            <option value="1">NETTO DI TARA</option>
            <option value="2">NETTO DI SCARTO</option>
     
        </select>
    </div>
</div>
			


			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Luogo di destinazione</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{luogoDiDestinazione}"
						class="form-control" required>
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Categoria</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{categoria}" class="form-control"
						required>
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Aspetto esteriore</label>
				<div class="col-sm-9">
					<input type="text" th:field="*{aspettoEsteriore}"
						class="form-control" required>
				</div>
			</div>
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Primo incaricato del trasporto</label>

				<div class="col-sm-9">
					<select name="trasportatore1Id" class="form-select" required>
						<option value="">-- Seleziona Trasportatore --</option>
						<option th:each="c : ${trasportatori}" th:value="${c.id}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>
			<div class="row mb-3 align-items-center">
				<label class="col-sm-3 col-form-label">Secondo incaricato del trasporto</label>

				<div class="col-sm-9">
					<select name="trasportatore2Id" class="form-select" >
						<option value="">-- Seleziona Trasportatore --</option>
						<option th:each="c : ${trasportatori}" th:value="${c.id}"
							th:text="${c.name}"></option>
					</select>
				</div>
			</div>

<div class="row mb-3 align-items-center">
    <label class="col-sm-3 col-form-label">Cessione Beni</label>

    <div class="col-sm-9">
        <select th:field="*{cessioneBeniConPrezzo}" class="form-select" >
            <option value="">-- Seleziona Cessione Beni --</option>

            <option value="1">Cessione beni con prezzo</option>

     
        </select>
    </div>
</div>


			<button type="submit" class="btn btn-success">Crea DDT</button>

		</form>

	</div>



</body>
<script>
const input = document.getElementById("numeroDDT");
const message = document.getElementById("ddtMessage");

let timer;

input.addEventListener("input", () => {

    clearTimeout(timer);

    timer = setTimeout(async () => {

        const numero = input.value.trim();

        if (numero === "") {
            message.textContent = "";
            input.classList.remove("is-valid", "is-invalid");
            return;
        }

        try {

            const response = await fetch(
                `/ddt/check?numeroDDT=${encodeURIComponent(numero)}`
            );

            const data = await response.json();

            if (data.exists) {

                input.classList.remove("is-valid");
                input.classList.add("is-invalid");

                message.className = "text-danger";
                message.textContent =
                    "⚠ Numero DDT già presente nel database";

            } else {

                input.classList.remove("is-invalid");
                input.classList.add("is-valid");

                message.className = "text-success";
                message.textContent =
                    "✓ Numero DDT disponibile";
            }

        } catch (e) {
            console.error(e);
        }

    }, 500); // debounce
});
document.querySelector("form").addEventListener("submit", e => {

    if (input.classList.contains("is-invalid")) {
        e.preventDefault();
        alert("Numero DDT già esistente.");
    }

});
</script>
</html>
