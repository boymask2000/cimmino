<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Movimenti Bin</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.table-scroll {
	max-height: 500px;
	overflow-y: auto;
	border: 1px solid #dee2e6;
	border-radius: 0.5rem;
}

.table-scroll thead th {
	position: sticky;
	top: 0;
	z-index: 1;
}
</style>
</head>

<body>
<div class="card p-3 mb-3">
<div class="d-flex justify-content-between align-items-center mb-3">

			<h2>Movimenti Bin</h2>

			<a th:href="@{/movimentibin/sposta/1}" class="btn btn-success"> Prendi Bin </a> 
			<a th:href="@{/movimentibin/sposta/0}" class="btn btn-success"> Restituisci Bin </a> 
			


		</div>
    <form method="get" th:action="@{/movimentivuoti/searchResult}">

        <div class="row g-3 align-items-end">

            <!-- DATA DA -->
            <div class="col-md-3">
                <label class="form-label">Data da</label>
                <input type="date"
                       class="form-control"
                       name="dataDa"
                       th:value="${dataDa}">
            </div>

            <!-- DATA A -->
            <div class="col-md-3">
                <label class="form-label">Data a</label>
                <input type="date"
                       class="form-control"
                       name="dataA"
                       th:value="${dataA}">
            </div>

            <!-- BIN -->
            <div class="col-md-3">
                <label class="form-label">Bin</label>
                <select class="form-select" name="bin"  >
                    <option value="">Tutti</option>

                    <option th:each="b : ${bins}"
                            th:value="${b.name}"
                            th:text="${b.name}"
                            th:selected="${param.bin == b.name}">
                    </option>

                </select>
            </div>

            <!-- BOTTONI -->
            <div class="col-md-3 d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    🔎 Cerca
                </button>

                <a th:href="@{/movimentibin/reset}" class="btn btn-outline-secondary">
                    Reset
                </a>

            </div>

        </div>

    </form>

</div>
	<div class="container mt-4">



		<div class="d-flex justify-content-between align-items-center mb-3">

			<h2>Movimenti Bin</h2>



		</div>


		<!-- LAYOUT AFFIANCATO -->
		<div class="row">

			<!-- TABELLA 30% -->
			<div class="col-12 col-md-4" style="flex: 0 0 30%; max-width: 30%;">

				<div class="table-scroll">

					<table class="table table-bordered table-striped table-hover mb-0">

						<thead class="table-dark">
							<tr>
								<th>Nome</th>
								<th>In</th>
								<th>Out</th>
								<th>Saldo</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="op : ${riepilogo}">
								<td th:text="${op.name}"></td>
								<td th:text="${op.totaleIn}"></td>
								<td th:text="${op.totaleOut}"></td>
								<td th:text="${op.saldo}"></td>
							</tr>
						</tbody>

					</table>

				</div>
			</div>

			<!-- TABELLA 70% -->
			<div class="col-12 col-md-8">

				<div class="table-scroll">

					<table class="table table-bordered table-striped table-hover mb-0">

						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Data</th>
								<th>Bin</th>
								<th>Num</th>
								<th>Mov</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="op : ${operazioni}">
								<td th:text="${op.id}"></td>
								<td th:text="${op.data}"></td>
								<td th:text="${op.binName}"></td>
								<td th:text="${op.numBins}"></td>
								<td th:text="${op.inout==0?'Uscita':'Ingresso'}"></td>
							</tr>
						</tbody>

					</table>

				</div>
			</div>

		</div>

	</div>

</body>
</html>
