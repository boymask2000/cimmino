<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<head>
<meta charset="UTF-8">
<title>Operazioni Commerciante</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.table-scroll {
	max-height: 500px;
	overflow-y: auto;
	border: 1px solid #dee2e6;
	border-radius: 0.5rem;
}

.table-scroll thead th {
	position: sticky;
	top: 0;
	z-index: 1;
}
</style>
</head>

<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2>Operazioni Commerciante</h2>
		</div>

		<!-- FILTRO COMMERCIANTE -->
		<form th:action="@{/web/commercianti/lista2/0}" method="get"
			class="row g-3 mb-4">

			<div class="col-md-4">

				<label class="form-label">Commerciante</label> <select
					name="commercianteId" class="form-select">

					<option value="0">-- Tutti --</option>

					<option th:each="c : ${commercianti}"
						th:value="${c.commerciante_id}" th:text="${c.name}"></option>

				</select>

			</div>

			<div class="col-md-2 d-flex align-items-end">

				<button type="submit" class="btn btn-success w-100">Filtra
				</button>

			</div>

		</form>

		<!-- TABELLA SCROLLABILE -->
		<div class="table-scroll">
			<form th:action="@{/web/commercianti/salva}" method="post">
				<table class="table table-bordered table-striped table-hover mb-0">

					<thead class="table-dark">
						<tr>

							<th>Data</th>
							<th>DDT</th>
							<th>Commerciante</th>
							<!-- 						<th>Merce</th> -->
							<!-- 						<th>Bin</th> -->
							<!-- 						<th class="text-end">N° Bins</th> -->
							<th class="text-end">Lordo</th>
							<th class="text-end">Netto di Tara</th>
							<th class="text-end">Netto di Scarto</th>
							<th class="text-end">Scarto</th>
							<th class="text-end">Tara</th>
							<th class="text-end">Bins</th>
							<th class="text-end">Prezzo</th>
							<th class="text-end">Importo</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="op : ${operazioni}" th:attr="data-id=${op.id}">



							<td th:text="${op.data}"></td>

							<td th:text="${op.ddt}"></td>

							<td
								th:text="${op.commerciante != null ? op.commerciante.name : ''}">
							</td>

							<!-- 						<td th:text="${op.merce != null ? op.merce.name : ''}"></td> -->

							<!-- 						<td th:text="${op.bin != null ? op.bin.name : ''}"></td> -->
							<!-- 						<td th:text="${op.nBins}" class="text-end"></td> -->

							<td th:text="${op.peso_lordo}" class="text-end"></td>

							<td th:text="${op.nettoDiTara}" class="text-end"></td>
							<td th:text="${op.nettoDiScarto}" class="text-end"></td>
							<td th:text="${op.scarto}" class="text-end"></td>
							<td th:text="${op.tara}" class="text-end"></td>
							<td>
								<table>
									<tr th:each="bin : ${op.bins}">
										<td th:text="${bin.bin.name}" class="text-start"></td>
										<td th:text="${bin.numBins}" class="text-end"></td>

									</tr>
								</table>
							</td>

							<td>
							<input class="form-control auto-save text-end"
       type="number"
       step="0.01"
       th:value="${op.prezzo}"
       data-field="prezzo">
								
								
								</td>
							
							<td class="importo text-end"
    th:text="${op.importo}">
</td>

						</tr>

					</tbody>
					<tfoot class="table-dark">
						<tr>
							<td colspan="11" class="text-end fw-bold">Totale</td>
							<td th:text="${totale}" class="text-end fw-bold"></td>
						</tr>
					</tfoot>

				</table>
				
			</form>


		</div>

	</div>

</body>
<script>
document.querySelectorAll(".auto-save").forEach(input => {

    let timer;

    input.addEventListener("input", function () {
        clearTimeout(timer);

        timer = setTimeout(() => {

            const row = input.closest("tr");
            const id = row.dataset.id;
            const field = input.dataset.field;
            const value = input.value;

            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;

            fetch("/web/commercianti/vendite/update-field", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [header]: token
                },
                body: JSON.stringify({
                    id: id,
                    field: field,
                    value: value
                })
            })
            .then(res => {
                if (!res.ok) throw new Error("Errore salvataggio");
            
                return res.json();
            })
            .then(data => {
                console.log("Salvato", data);
                row.querySelector(".importo").textContent =
                    data.importo;
            })
            .catch(err => {
                console.error(err);
            });

        }, 800); // debounce
    });

});
</script>
</html>
