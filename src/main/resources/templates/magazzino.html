<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Giacenza in frigo</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>

.container {
	margin-top: 40px;
}

table {
	background: white;
}
</style>
</head>

<body>
<div th:replace="navbar :: navbar"></div>
	<div class="container">

		<h2 class="mb-4">Giacenza in frigo</h2>

		<table class="table table-bordered table-striped">
			<thead class="table-dark">
				<tr>
					<th>Data</th>
					<th>Nome</th>
					<th>Merce</th>
					<th>Num</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="entry : ${rows}">
					<td  th:text="${entry.sDate}">
					</td>
					<td  th:text="${entry.bin}">
					</td>
					<td  th:text="${entry.nomeMerce}">
					</td>
					<td  th:text="${entry.num}">
					</td>
					
				</tr>


				
			</tbody>
		</table>

	</div>

</body>
</html>
