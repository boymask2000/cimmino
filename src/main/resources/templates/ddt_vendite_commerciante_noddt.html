<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Vendite Commerciante</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	background-color: #f5f7fa;
	font-family: Arial, sans-serif;
}

.page-container {
	max-width: 1300px;
	margin: 40px auto;
	padding: 20px;
}

.page-title {
	font-size: 2rem;
	font-weight: bold;
	color: #2c3e50;
}

.subtitle {
	color: #6c757d;
	margin-bottom: 25px;
}

.card-custom {
	background: white;
	border-radius: 18px;
	padding: 25px;
	box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
}

.table thead {
	background-color: #0d6efd;
	color: white;
}

.table th {
	white-space: nowrap;
	vertical-align: middle;
	text-align: center;
}

.table td {
	vertical-align: middle;
	text-align: center;
}

.clickable-row {
	cursor: pointer;
	transition: all 0.15s ease;
}

.clickable-row:hover {
	background-color: #f0f6ff;
}

.riga-selezionata {
	background-color: #d6e9ff !important;
}

.importo {
	font-weight: bold;
	color: #198754;
}

.badge-ddt {
	font-size: 0.85rem;
	padding: 8px 12px;
	border-radius: 10px;
}

.btn-submit {
	padding: 10px 22px;
	font-weight: 600;
	border-radius: 12px;
	min-width: 220px;
}

.checkbox-custom {
	transform: scale(1.3);
	cursor: pointer;
}

.footer-actions {
	margin-top: 25px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 15px;
}

.selected-counter {
	font-weight: 600;
	color: #0d6efd;
}

.empty-message {
	text-align: center;
	padding: 40px;
	color: #6c757d;
	font-size: 1.1rem;
}
</style>

</head>

<body>

	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid page-container">

		<div class="mb-4">

			<h1 class="page-title">
				<i class="bi bi-cart-check"></i> Vendite Commerciante
			</h1>

			<div class="subtitle">Gestione vendite associate al
				commerciante</div>

			<h3 class="fw-bold text-primary" th:text="${commerciante.name}"></h3>

		</div>

		<div class="card-custom">

			<form th:action="@{/ddt/parameters}" >

				<input type="hidden" name="commercianteId"
					th:value="${commerciante.commerciante_id}" />

				<div class="table-responsive">

					<table class="table table-hover align-middle">

						<thead>

							<tr>
								<th width="80">Sel.</th>
								<th>Data</th>
								<th>Importo</th>
								<th>DDT</th>
							</tr>

						</thead>

						<tbody>

							<tr th:if="${#lists.isEmpty(vendite)}">
								<td colspan="4" class="empty-message"><i
									class="bi bi-inbox fs-2"></i> <br> Nessuna vendita
									disponibile</td>
							</tr>

							<tr th:each="ven : ${vendite}" class="clickable-row">

								<td><input type="checkbox" name="ids" th:value="${ven.id}"
									class="form-check-input checkbox-custom row-checkbox">

								</td>

								<td th:text="${ven.data}"></td>

								<td class="importo" th:text="${'€ ' + ven.importo}"></td>

								<td><span th:if="${ven.ddt != null}"
									class="badge bg-success badge-ddt"> <i
										class="bi bi-check-circle"></i> Associato

								</span> <span th:if="${ven.ddt == null}"
									class="badge bg-secondary badge-ddt"> <i
										class="bi bi-dash-circle"></i> Non presente

								</span></td>

							</tr>

						</tbody>

					</table>

				</div>

				<div class="footer-actions">

					<div class="selected-counter">
						<i class="bi bi-check2-square"></i> Selezionati: <span
							id="selectedCount">0</span>
					</div>

					<button type="submit" id="submitBtn"
						class="btn btn-primary btn-submit" disabled>

						<i class="bi bi-send-check"></i> Invia selezionati

					</button>

				</div>

			</form>

		</div>

	</div>

	<script>

		document.querySelectorAll(".clickable-row").forEach(row => {

			row.addEventListener("click", function(e) {

				if (e.target.type !== "checkbox") {

					const checkbox = row.querySelector(".row-checkbox");
					checkbox.checked = !checkbox.checked;
				}

				aggiornaStile(row);
				aggiornaContatore();
			});

			const checkbox = row.querySelector(".row-checkbox");

			checkbox.addEventListener("change", function() {

				aggiornaStile(row);
				aggiornaContatore();

			});

		});

		function aggiornaStile(row) {

			const checkbox = row.querySelector(".row-checkbox");

			if (checkbox.checked) {
				row.classList.add("riga-selezionata");
			} else {
				row.classList.remove("riga-selezionata");
			}
		}

		function aggiornaContatore() {

		    const checked = document.querySelectorAll(".row-checkbox:checked").length;

		    document.getElementById("selectedCount").innerText = checked;

		    const btn = document.getElementById("submitBtn");

		    if (checked > 0) {
		        btn.disabled = false;
		        btn.classList.remove("disabled");
		    } else {
		        btn.disabled = true;
		        btn.classList.add("disabled");
		    }
		}

	</script>

</body>

</html>
