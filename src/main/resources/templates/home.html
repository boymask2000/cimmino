<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">
<title>Status</title>

<link rel="stylesheet" href="/css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
    body {
        background: #eef2f7;
    }

    .page-title {
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #0d6efd;
    }

    .subtitle {
        font-size: 0.95rem;
        color: #6c757d;
    }

    .main-card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0,0,0,.08);
        background: white;
    }

    .form-label {
        font-weight: 600;
        color: #343a40;
    }

    .form-control {
        border-radius: 10px;
        padding: 10px;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
        padding: 10px;
    }

    .btn-primary {
        background: #0d6efd;
    }

    .btn-success {
        background: #198754;
    }

    .btn:hover {
        transform: translateY(-1px);
        transition: 0.15s ease-in-out;
    }

    .logout-btn {
        border-radius: 12px;
        padding: 8px 20px;
        font-weight: 600;
    }
</style>

</head>

<body>

<div th:replace="navbar :: navbar"></div>

<div class="container py-5" style="max-width: 950px;">

    <div sec:authorize="isAuthenticated()">

        <!-- HEADER -->
        <div class="text-center mb-4">
            <h1 class="page-title mb-2" th:text="${nomeApp}">
                Applicazione
            </h1>

            <div class="subtitle">
                Filtra i dati per intervallo di date e scegli l’operazione
            </div>
        </div>

        <!-- CARD -->
        <div class="card main-card">
            <div class="card-body p-4">

                <form method="get">

                    <div class="row g-4 align-items-end">

                        <!-- DATA INIZIO -->
                        <div class="col-md-4">
                            <label class="form-label">Data Inizio</label>
                            <input type="date"
                                   name="startDate"
                                   class="form-control"
                                   th:value="${startDate != null ? #temporals.format(startDate, 'yyyy-MM-dd') : ''}">
                        </div>

                        <!-- DATA FINE -->
                        <div class="col-md-4">
                            <label class="form-label">Data Fine</label>
                            <input type="date"
                                   name="endDate"
                                   class="form-control"
                                   th:value="${endDate != null ? #temporals.format(endDate, 'yyyy-MM-dd') : ''}">
                        </div>

                        <!-- AZIONI -->
                        <div class="col-md-4 d-grid gap-2">

                            <button type="submit"
                                    formaction="/web/filter"
                                    class="btn btn-primary">
                                📦 Arrivi
                            </button>

                            <button type="submit"
                                    formaction="/web/commercianti/filter/vendite"
                                    class="btn btn-success">
                                🛒 Commercianti
                            </button>

                        </div>

                    </div>

                </form>

            </div>
        </div>

        <!-- LOGOUT -->
        <div class="text-center mt-5">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="btn btn-outline-danger logout-btn">
                    Esci
                </button>
            </form>
        </div>

    </div>

</div>

</body>
</html>
