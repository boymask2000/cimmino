<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">
<title>Status</title>

<link rel="stylesheet" href="/css/style.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
    body {
        background-color: #f5f7fa;
    }

    .page-title {
        font-weight: 700;
        color: #0d6efd;
    }

    .main-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.10);
    }

    .btn {
        border-radius: 10px;
    }

    .logout-form {
        display: inline-block;
    }
</style>

</head>

<body>

    <!-- Navbar -->
    <div th:replace="navbar :: navbar"></div>

    <div class="container py-5" style="max-width: 900px;">

        <div sec:authorize="isAuthenticated()">

            <!-- Titolo -->
            <div class="text-center mb-4">
                <h1 class="page-title" th:text="${nomeApp}">
                    Applicazione
                </h1>

                <p class="text-muted">
                    Seleziona l'intervallo temporale ed esegui l'operazione desiderata.
                </p>
            </div>

            <!-- Card principale -->
            <div class="card main-card">
                <div class="card-body p-4">

                    <form method="get">

                        <div class="row g-3 align-items-end">

                            <!-- Data Inizio -->
                            <div class="col-md-4">
                                <label class="form-label">
                                    Data Inizio
                                </label>

                                <input type="date"
                                       name="startDate"
                                       class="form-control"
                                       th:value="${startDate != null ? #temporals.format(startDate, 'yyyy-MM-dd') : ''}">
                            </div>

                            <!-- Data Fine -->
                            <div class="col-md-4">
                                <label class="form-label">
                                    Data Fine
                                </label>

                                <input type="date"
                                       name="endDate"
                                       class="form-control"
                                       th:value="${endDate != null ? #temporals.format(endDate, 'yyyy-MM-dd') : ''}">
                            </div>

                            <!-- Pulsanti -->
                            <div class="col-md-4 d-grid gap-2">

                                <button type="submit"
                                        formaction="/web/filter"
                                        class="btn btn-primary">
                                    📦 Filtra Arrivi
                                </button>

<!--                                 <button type="submit" -->
<!--                                         formaction="/web/commercianti/filter/groups" -->
<!--                                         class="btn btn-success"> -->
<!--                                     🛒 Filtra Commercianti -->
<!--                                 </button> -->
                                 <button type="submit"
                                        formaction="/web/commercianti/filter/vendite"
                                        class="btn btn-success">
                                    🛒 Filtra Commercianti
                                </button>

                            </div>

                        </div>

                    </form>

                </div>
            </div>

            <!-- Logout -->
            <div class="text-center mt-5">

                <form th:action="@{/logout}"
                      method="post"
                      class="logout-form">

                    <button type="submit"
                            class="btn btn-outline-danger">
                        Esci
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
