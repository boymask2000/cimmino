<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<meta charset="UTF-8">
<title>Status</title>
<link rel="stylesheet" href="/css/style.css">
<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div th:replace="navbar :: navbar"></div>

	<div class="container mt-4">

		<!-- LOGGATO -->
		<div sec:authorize="isAuthenticated()">

			<h1 class="text-center mb-4">Movimenti</h1>

			<!-- FORM DATE -->
			<form th:action="@{/web/filter}" method="get"
				class="row g-3 mb-4 justify-content-center">

				<div class="col-md-3">
					<label class="form-label">Data Inizio</label> <input type="date"
						name="startDate" class="form-control"
						th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}" >
				</div>
				
				<div class="col-md-3">
					<label class="form-label">Data Fine</label> <input type="date"
						name="endDate" class="form-control"
						th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}">
				</div>

				<div class="col-md-2 d-flex align-items-end">
					<button type="submit" class="btn btn-primary w-100">
						Filtra Arrivi</button>
				</div>

			</form>
			
			<form th:action="@{/web/commercianti/filter}" method="get"
				class="row g-3 mb-4 justify-content-center">

				<div class="col-md-3">
					<label class="form-label">Data Inizio</label> <input type="date"
						name="startDate" class="form-control"
						th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}">
				</div>

				<div class="col-md-3">
					<label class="form-label">Data Fine</label> <input type="date"
						name="endDate" class="form-control"
						th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}">
				</div>

				<div class="col-md-2 d-flex align-items-end">
					<button type="submit" class="btn btn-primary w-100">
						Filtra Commercianti</button>
				</div>

			</form>
<!-- 			<div class="d-flex justify-content-center"> -->
<!-- 				<a th:href="@{/web/commercianti/lista/0}" -->
<!-- 					class="btn btn-primary btn-sm">Commercianti </a> -->
<!-- 			</div> -->
		</div>

		<!-- NON LOGGATO -->


	</div>

</body>
</html>
