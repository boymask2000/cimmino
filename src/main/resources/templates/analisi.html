<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Analisi</title>

<link rel="stylesheet" href="/css/style.css">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.section-row {
	display: flex;
	align-items: flex-start;
	gap: 30px;
	margin-bottom: 40px;
}

.info-block {
	min-width: 280px;
}

.table-block {
	flex: 1;
}

.text-white {
	color: white;
}
</style>

</head>

<body>

	<div class="container mt-4">
<h1 class="mb-0">Analisi</h1>
	<div class="section-row">
<p th:text="${analisi.arrivo.data}"></p>
<p th:text="${analisi.arrivo.merce.name}"></p></div>
		<!-- ARRIVO -->
		<div class="section-row">

			<div class="info-block">

				<div class="d-flex align-items-center gap-2 mb-2">
					<label class="form-label mb-0 text-white">
						Peso Lordo Arrivo:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totPesoLordoArrivo}">
					</p>
				</div>

				<div class="d-flex align-items-center gap-2 mb-2">
					<label class="form-label mb-0 text-white">
						Peso Netto Arrivo:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totPesoNettoArrivo}">
					</p>
				</div>

				<div class="d-flex align-items-center gap-2">
					<label class="form-label mb-0 text-white">
						Calo:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.arrivo.calo}">
					</p>
				</div>

			</div>

			<div class="table-block">

				<div class="table-scroll">

					<table
						class="table table-bordered table-striped table-hover mb-0">

						<thead class="table-dark">
							<tr>
								<th>Bin</th>
								<th>Num</th>
								<th>Lordo</th>
								<th>Netto</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="op : ${analisi.arrivo.bins}">
								<td th:text="${op.binName}"></td>
								<td th:text="${op.numBins}"></td>
								<td th:text="${op.pesoLordo}"></td>
								<td th:text="${op.pesoNetto}"></td>
							</tr>
						</tbody>

<!-- 						<tfoot class="table-dark"> -->
<!-- 							<tr> -->
<!-- 								<td colspan="3" class="text-end fw-bold"> -->
<!-- 									Totale -->
<!-- 								</td> -->

<!-- 								<td th:text="${totale}" -->
<!-- 									class="text-end fw-bold"> -->
<!-- 								</td> -->
<!-- 							</tr> -->
<!-- 						</tfoot> -->

					</table>

				</div>

			</div>

		</div>

		<!-- VENDITE -->
		<div class="section-row">

			<div class="info-block">

				<div class="d-flex align-items-center gap-2 mb-2">
					<label class="form-label mb-0 text-white">
						Peso Lordo Vendite:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totPesoLordoVendite}">
					</p>
				</div>

				<div class="d-flex align-items-center gap-2">
					<label class="form-label mb-0 text-white">
						Peso Netto Vendite:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totPesoNettoVendite}">
					</p>
				</div>
				
				<div class="d-flex align-items-center gap-2">
					<label class="form-label mb-0 text-white">
						Somma netti Arrivi:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totPesoNettoArrivo}">
					</p>
				</div>
				<div class="d-flex align-items-center gap-2">
					<label class="form-label mb-0 text-white">
						Somma netti Tara Vendite:
					</label>

					<p class="mb-0 text-white"
						th:text="${analisi.totNettoDiTaraVendite}">
					</p>
				</div>

			</div>

			<div class="table-block">

				<table
					class="table table-bordered table-striped table-hover mb-0">

					<tbody>

						<tr th:each="ven : ${analisi.vendite}">

							<td>

								<div class="table-scroll">

									<table
										class="table table-bordered table-striped table-hover mb-4">

										<thead class="table-dark">
											<tr>
											<th>Data</th>
												<th>Bin</th>
												<th>Num</th>
												<th>Lordo</th>
												<th>Netto</th>
											</tr>
										</thead>

										<tbody>

											<tr th:each="op : ${ven.bins}">
											<td th:text="${ven.data}"></td>
												<td th:text="${op.bin.name}"></td>
												<td th:text="${op.numBins}"></td>
												<td th:text="${op.pesoLordo}"></td>
												<td th:text="${op.pesoNetto}"></td>
											</tr>

										</tbody>

<!-- 										<tfoot class="table-dark"> -->
<!-- 											<tr> -->
<!-- 												<td colspan="3" -->
<!-- 													class="text-end fw-bold"> -->
<!-- 													Totale -->
<!-- 												</td> -->

<!-- 												<td th:text="${totale}" -->
<!-- 													class="text-end fw-bold"> -->
<!-- 												</td> -->
<!-- 											</tr> -->
<!-- 										</tfoot> -->

									</table>

								</div>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>
</html>
