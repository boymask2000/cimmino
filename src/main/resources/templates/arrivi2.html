<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Elenco Arrivi</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-3">

			<h1 class="mb-0">Elenco Arrivi</h1>

			<a th:href="@{/web/arrivi/new}" class="btn btn-success"> + Nuovo
				Arrivo </a>

		</div>

		<div class="table-responsive">

			<table class="table table-bordered table-striped text-center">


				<!-- 🔥 CORPO TABELLA -->


				<tr th:each="a : ${results}">
					<td class="align-middle text-nowrap" style="width: 1%;"><a
						th:href="@{/web/vendita/new/{id}(id=${a.id})}"
						class="btn btn-primary btn-sm"> Modifica </a></td>
					<td>

						<table border="1">


							<tr>
								<td th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}"></td>
							</tr>

							<tr>
								<td th:text="${a.merce}"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_lordo}"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_netto}"></td>
							</tr>

							<tr>
								<td th:text="${a.calo}"></td>
							</tr>

							<tr>
								<td><span th:text="${a.freddo == 1 ? 'Freddo' : 'Caldo'}"></span>
								</td>
							</tr>

							<tr>
								<td th:text="${a.intestazione_merce}"></td>
							</tr>

							<!-- 🔥 LISTA BINS -->
							<tr>
								<td>
									<div th:if="${#lists.isEmpty(a.bins)}">
										<span class="text-muted">Nessun bin</span>
									</div>

									<ul class="list-unstyled mb-0"
										th:if="${!#lists.isEmpty(a.bins)}">

										<li th:each="b : ${a.bins}"><span
											class="badge bg-primary me-1"> Bin: <span
												th:text="${b.bin != null ? b.bin.name : 'N/A'}"></span>
										</span> <span class="badge bg-secondary"> Qta: <span
												th:text="${b.numBins}"></span>
										</span></li>

									</ul>
								</td>
							</tr>

						</table>
					</td>



					<td>

						<table class="table table-sm mb-0">
							<thead class="table-dark">
								<tr>

									<th>Commerciante</th>
									<th>Data</th>
									<th>DTT</th>
									<th>Bin</th>
									<th>Colore</th>
									<th>Lordo</th>
									<th>Netto</th>
									<th>Tara</th>
									<th>Importo</th>
								</tr>
							</thead>
							<tbody>

								<tr th:each="b : ${a.vendite}">

									<td><span class="badge bg-primary"> <span
											th:text="${b.commerciante.name}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.data}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.dtt}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.nBins}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.bin.name}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.lordo}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.netto}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.bin.tara}"></span>
									</span></td>

								
									<td><span th:text="${b.importo}"></span></td>

								</tr>

							</tbody>

						</table>

					</td>


				</tr>
			</table>
		</div>
</body>
</html>
