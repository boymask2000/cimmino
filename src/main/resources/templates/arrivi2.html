<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Elenco Arrivi</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container-fluid mt-4">>

		<div class="d-flex justify-content-between align-items-center mb-3">

			<h1 class="mb-0">Elenco Arrivi</h1>

			<a th:href="@{/web/arrivi/new}" class="btn btn-success"> Nuovo
				Arrivo </a> 
			
<a th:href="@{/pdf/generale_arrivi}"
   class="btn btn-success">
    🖨 Stampa
</a>

		</div>

		<div class="table-responsive">

			<table class="table table-bordered table-striped text-center">


				<!-- 🔥 CORPO TABELLA -->

				<tr th:each="a : ${results}">

					<td class="align-middle text-nowrap" style="width: 1%;">
						<div th:if="${a.sums.get('AVAIL')!= 0}">
							<a th:href="@{/web/vendita/new/{id}(id=${a.id})}"
								class="btn btn-primary btn-sm"> Vendita </a>
						</div>
<!-- 						<a th:href="@{/web/vendita/new/{id}(id=${a.id})}" -->
<!-- 								class="btn btn-primary btn-sm"> Vendita </a> -->
								
						<div th:if="${a.sums.get('AVAIL')== 0}">
							<p>Vendite</p><p>complete</p>
							<a th:href="@{/web/analisi/show/{id}(id=${a.id})}"
								class="btn btn-primary btn-sm"> Analisi </a>
						</div>
					</td>

			
					<td>
						<table border="1">


							<tr>
								<td th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}"></td>
							</tr>

							<tr>
								<td th:text="${a.merce!= null ? a.merce.name:' ' }"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_lordo}"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_netto}"></td>
							</tr>

							<tr>
								<td th:text="${a.calo}"></td>
							</tr>

							<tr>
								<td><span th:text="${a.freddo == 1 ? 'Freddo' : 'Caldo'}"></span>
								</td>
							</tr>

							<tr>
								<td th:text="${a.intestazione_merce}"></td>
							</tr>

							<!-- 🔥 LISTA BINS -->
							<tr>
								<td>
									<div th:if="${#lists.isEmpty(a.bins)}">
										<span class="text-muted">Nessun bin</span>
									</div>

									<ul class="list-unstyled mb-0"
										th:if="${!#lists.isEmpty(a.bins)}">

										<li th:each="b : ${a.bins}"><span
											class="badge bg-primary me-1"> Bin: <span
												th:text="${b.bin != null ? b.bin.name : 'N/A'}"></span>
										</span> <span class="badge bg-secondary"> Qta: <span
												th:text="${b.numBins}"></span>
										</span></li>

									</ul>
								</td>
							</tr>
							<tr>
								<td class="align-middle text-nowrap" style="width: 1%;"><a
									th:href="@{/web/arrivi/show/{id}(id=${a.id})}"
									class="btn btn-primary btn-sm"> Dettaglio </a></td>
							</tr>

						</table>
					</td>



					<td>

						<table class="table table-sm mb-0">
							<thead class="table-dark">
								<tr>

									<th>Commerciante</th>
									<th>Data</th>
									<th>DTT</th>
									
									<th>Bin</th>
									

									<th>Lordo</th>
									<th>Netto di Tara</th>
									<th>Netto di Scarto</th>
									<th>Media</th>
									
									<th>Scarto</th>
									<th>Prezzo</th>

<th>Frigo</th>
									<th>Importo</th>
									<th></th>
								</tr>
							</thead>
							<tbody>

								<tr th:each="b : ${a.vendite}">

									<td><span class="badge bg-primary"> <span
											th:text="${b.commerciante.name}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.data}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.dtt}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.numeroTotaleBins}"></span>
									</span></td>
									

									<td><span class="badge bg-primary"> <span
											th:text="${b.peso_lordo}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.nettoDiTara}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.nettoDiScarto}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.media}"></span>
									</span></td>
									
									<td><span class="badge bg-primary"> <span
											th:text="${b.scarto}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.prezzo}"></span>
									</span></td>
<td><span th:text="${b.frigo}"></span></td>
									<td><span th:text="${b.importo}"></span></td>
<td>
<div class="col-md-2">

    <a class="btn btn-outline-primary btn-sm"
    
        th:href="@{'/web/vendita/show/' + ${b.id}}"
       target="_blank"
       title="Visualizza dettaglio">

        <i class="bi bi-eye"></i>
    </a>

</div>
</td>
								</tr>
							<tfoot>
								<tr>
									<td colspan="3"></td>
									<td th:text="${a.sums.get('LORDO')}"></td>
									<td th:text="${a.sums.get('NETTO')}"></td>
									<td colspan="5"></td>
								</tr>
							</tfoot>

							</tbody>

						</table>

					</td>


				</tr>
			</table>
		</div>
	</div>
</body>
</html>
