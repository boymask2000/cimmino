<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Arrivi</title>

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmDelete(id) {
    Swal.fire({
        title: 'Sei sicuro?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Elimina'
    }).then((result) => {
        if (result.isConfirmed) {

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;

            const form = document.createElement('form');
            form.method = 'post';
            form.action = '/web/vendita/delete/' + id;

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = '_csrf';
            input.value = csrfToken;

            form.appendChild(input);

            document.body.appendChild(form);
            form.submit();
        }
    });
}
</script>
<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid mt-4">

		<div class="d-flex justify-content-between align-items-center mb-3">

			<h1 class="mb-0">Arrivi</h1>

			<a th:href="@{/web/arrivi/new}" class="btn btn-success"> Nuovo
				Arrivo </a> <a th:href="@{/gruppovendite/new}" class="btn btn-success">
				Nuovo G.Vendita </a>

			<form th:action="@{/pdf/filter_arrivi}">

				<input type="hidden" name="startDate" th:value="${startDate}">
				<input type="hidden" name="endDate" th:value="${endDate}">

				<button type="submit" class="btn btn-success">🖨 Stampa</button>

			</form>

		</div>

		<div class="table-responsive">

			<table class="table table-bordered table-striped text-center">
				<thead class="table-dark">
								<tr>
									<th></th>
									<th></th>
									<th>Commerciante</th>
									<th>Data</th>
									<th>DDT</th>

									<th>Bin</th>


									<th>Lordo</th>
									<th>Netto di Tara</th>
									<th>Netto di Scarto</th>
									<th>Media</th>

									<th>Scarto</th>
									<th>Prezzo</th>


									<th>Importo</th>
									<th></th>
									<th></th>
									<th></th>
								</tr>
							</thead>
							<tbody>
				<tr th:each="a : ${gruppoVendite}">
					<td><a th:href="@{/gruppovendite/show/{id}(id=${a.id})}"
						class="btn btn-warning btn-sm"> <i class="fa fa-edit"></i>
					</a></td>
					<td>
						<!-- <a th:href="@{/web/vendita/edit/{id}(id=${b.id})}" class="btn btn-warning btn-sm"> -->
						<!--     <i class="fa fa-edit"></i> --> <!-- </a> -->
						<div>
							<button type="button" class="btn btn-danger btn-sm"
								th:onclick="'confirmDelete(' + ${a.id} + ')'">
								<i class="bi bi-trash"></i>
							</button>


						</div>


					</td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.commerciante.name}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${@fmt.date(a.data)}"></span>
					</span></td>

					<td><span class="badge bg-primary"> <span
							th:text="${a.ddt}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.numeroTotaleBins}"></span>
					</span></td>


					<td><span class="badge bg-primary"> <span
							th:text="${a.peso_lordo}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.nettoDiTara}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.nettoDiScarto}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.media}"></span>
					</span></td>

					<td><span class="badge bg-primary"> <span
							th:text="${a.scarto}"></span>
					</span></td>
					<td><span class="badge bg-primary"> <span
							th:text="${a.prezzo}"></span>
					</span></td>

					<td><span th:text="${a.importo}"></span></td>
				</tr>
				</tbody>
			</table>

			<table class="table table-bordered table-striped text-center">


				<!-- 🔥 CORPO TABELLA -->

				<tr th:each="a : ${results}">

					<td class="align-middle text-nowrap" style="width: 1%;">
						
						<div th:if="${a.sums.get('AVAIL')== 0}">
							<p>Vendite</p>
							<p>complete</p>
							<a th:href="@{/web/analisi/show/{id}(id=${a.id})}"
								class="btn btn-primary btn-sm"> Analisi </a>
						</div>
					</td>


					<td>
						<table border="1">


							<tr>
								<td th:text="${@fmt.date(a.data)}"></td>
							</tr>

							<tr>
								<td th:text="${a.merce!= null ? a.merce.name:' ' }"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_lordo}"></td>
							</tr>

							<tr>
								<td th:text="${a.peso_netto}"></td>
							</tr>

							<tr>
								<td th:text="${a.calo}"></td>
							</tr>

							<tr>
								<td><span th:text="${a.freddo == 1 ? 'Freddo' : 'Caldo'}"></span>
								</td>
							</tr>

							<tr>
								<td th:text="${a.intestazione_merce}"></td>
							</tr>


							<tr>
								<td>
									<div th:if="${#lists.isEmpty(a.bins)}">
										<span class="text-muted">Nessun bin</span>
									</div>


									<div th:if="${!#lists.isEmpty(a.bins)}">
										<table class="table table-bordered table-striped text-center"
											style="border: 1px solid black;">
											<tbody>
												<tr th:each="b : ${a.bins}">
													<td th:text="${b.bin.name}"></td>
													<td th:text="${b.numBins}"></td>
												</tr>
											</tbody>
										</table>
									</div>

								</td>
							</tr>
							<tr>
								<td class="align-middle text-nowrap" style="width: 1%;"><a
									th:href="@{/web/arrivi/show/{id}(id=${a.id})}"
									class="btn btn-primary btn-sm"> Dettaglio </a></td>
							</tr>

						</table>
					</td>



					<td>

						<table class="table table-sm mb-0">
							<thead class="table-dark">
								<tr>
									<th></th>
									<th></th>
									<th>Commerciante</th>
									<th>Data</th>
									<th>DDT</th>

									<th>Bin</th>


									<th>Lordo</th>
									<th>Netto di Tara</th>
									<th>Netto di Scarto</th>
									<th>Media</th>

									<th>Scarto</th>
									<th>Prezzo</th>


									<th>Importo</th>
									<th></th>
									<th></th>
									<th></th>
								</tr>
							</thead>
							<tbody>

								<tr th:class="${b.gruppoVendite != null} ? 'table-info' : ''"
									th:each="b : ${a.vendite}">
									<td><a th:href="@{/web/vendita/edit/{id}(id=${b.id})}"
										class="btn btn-warning btn-sm"> <i class="fa fa-edit"></i>
									</a></td>
									<td>
										<!-- <a th:href="@{/web/vendita/edit/{id}(id=${b.id})}" class="btn btn-warning btn-sm"> -->
										<!--     <i class="fa fa-edit"></i> --> <!-- </a> -->
										<div>
											<button type="button" class="btn btn-danger btn-sm"
												th:onclick="'confirmDelete(' + ${b.id} + ')'">
												<i class="bi bi-trash"></i>
											</button>


										</div>


									</td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.commerciante.name}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${@fmt.date(b.data)}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.ddt}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.numeroTotaleBins}"></span>
									</span></td>


									<td><span class="badge bg-primary"> <span
											th:text="${b.peso_lordo}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.nettoDiTara}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.nettoDiScarto}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.media}"></span>
									</span></td>

									<td><span class="badge bg-primary"> <span
											th:text="${b.scarto}"></span>
									</span></td>
									<td><span class="badge bg-primary"> <span
											th:text="${b.prezzo}"></span>
									</span></td>

									<td><span th:text="${b.importo}"></span></td>
									<td>
										<div class="col-md-2">

											<a class="btn btn-outline-primary btn-sm"
												th:href="@{'/web/vendita/show/' + ${b.id}}" target="_blank"
												title="Visualizza dettaglio"> <i class="bi bi-eye"></i>
											</a>

										</div>
									</td>
									<td>
										<div class="col-md-2"
											th:if="${b.gruppoVendite != null && b.gruppoVendite.status=='0'}">

											<a class="btn btn-outline-success btn-lg"
												th:href="@{'/gruppovendite/show/' + ${b.id}}"
												target="_blank" title="Chiudi gruppo"> <i
												class="bi bi-eye"></i>
											</a>
										</div>
									</td>
									<td>
										<div class="col-md-2" th:if="${b.isMasterGruppo == true}">
											<a><span th:text="M"></span></a>
										</div>

									</td>

								</tr>
							<tfoot>
								<tr>
									<td colspan="6"></td>
									<td th:text="${a.sums.get('LORDO')}"></td>
									<td th:text="${a.sums.get('NETTO')}"></td>
									<td colspan="5"></td>
								</tr>
							</tfoot>

							</tbody>

						</table>

					</td>


				</tr>
			</table>
		</div>
	</div>
</body>
</html>
