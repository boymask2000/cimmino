<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuova Vendita</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h2 class="mb-4">Crea Nuova Vendita</h2>

		<form th:action="@{/web/vendita/save}" th:object="${vendita}"
			method="post">
			<input type="hidden" th:field="*{arrivoEntity}" />
			<!-- COMMERCIANTE DROPDOWN -->
			<div class="mb-3">
				<label class="form-label">Commerciante</label> <select
					class="form-select" th:field="*{commerciante.commerciante_id}"
					required>
					<option value="">-- Seleziona Commerciante --</option>

					<option th:each="c : ${commercianti}"
						th:value="${c.commerciante_id}" th:text="${c.name}"></option>

				</select>
			</div>
			<!-- IMPORTO -->


			<!-- DATA -->
			<input type="date" class="form-control"
				th:value="${#temporals.format(currData, 'yyyy-MM-dd')}"
				name="currData" required>


<div class="mb-3">
				<label class="form-label">Merce</label> <input type="text"
					step="0.01" class="form-control" th:field="*{arrivoEntity.merce.name}" required>
			</div>


			<!-- BIN DROPDOWN -->
			<div class="mb-3">
				<label class="form-label">Bin</label> <select class="form-select"
					th:field="*{bin.id}" id="binSelect" required>
					<option value="">-- Seleziona Bin --</option>

					<option th:each="b : ${bins}" th:value="${b.id}"
						th:text="${b.name}"></option>

				</select>
			</div>
			<!-- N BINS -->
			<div class="mb-3">
				<label class="form-label">Numero Bins</label> <input type="number"
					class="form-control" th:field="*{nBins}" min="1" required>
			</div>
			<input type="hidden" th:field="*{bin.peso_lordo}" id="peso_lordo">

			<div class="mb-3">
				<label class="form-label">Prezzo</label> <input type="number"
					step="0.01" class="form-control" th:field="*{prezzo}" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Importo</label> <input type="number"
					step="0.01" class="form-control" th:field="*{importo}" required>
			</div>


			<!-- SUBMIT -->
			<button type="submit" class="btn btn-success">Salva Vendita
			</button>

		</form>

	</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const prezzo = document.querySelector("[name='prezzo']");
    const nBins = document.querySelector("[name='nBins']");
    const importo = document.querySelector("[name='importo']");
    const binSelect = document.getElementById("binSelect");

    let peso = 0;

    async function loadPesoBin(binId) {

        if (!binId) {
            peso = 0;
            calcolaTotale();
            return;
        }

        try {
            const response = await fetch(`/api/bin/${binId}/peso`);

            if (!response.ok) {
                console.error("Errore API:", response.status);
                peso = 0;
                return;
            }

            peso = await response.json();
            calcolaTotale();

        } catch (e) {
            console.error("Errore fetch:", e);
            peso = 0;
        }
    }

    function calcolaTotale() {

        const p = parseFloat(prezzo.value) || 0;
        const n = parseInt(nBins.value) || 0;

        importo.value = (p * n * peso).toFixed(2);
    }

    prezzo.addEventListener("input", calcolaTotale);
    nBins.addEventListener("input", calcolaTotale);

    binSelect.addEventListener("change", function () {
        loadPesoBin(this.value);
    });

});
</script>
</body>
</html>
