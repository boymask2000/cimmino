<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Nuova Vendita</title>

<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-4">

		<h2 class="mb-4">Crea Nuova Vendita</h2>

		<!-- ===================== FORM ===================== -->
		<form th:action="@{/web/vendita/save}" th:object="${vendita}"
			method="post" id="venditaForm">

			<input type="hidden" name="binsJson" id="binsJson">
			 <input
				type="hidden" name="prezzoFrigoxFreddo" id="prezzoFrigoxFreddo"
				th:value="${configurazione.prezzoFrigoxFreddo}"> 
			<input
				type="hidden" name="prezzoFrigoxCaldo" id="prezzoFrigoxCaldo"
				th:value="${configurazione.prezzoFrigoxCaldo}">
		

			<input type="hidden" name="arrivoId" id="arrivoId"
				th:value="${arrivo.id}">
				
			<div class="mb-3">
				<label class="form-label">Data</label> <input type="date"
					name="currData" th:value="${currData}" class="form-control"
					required>
			</div>
			<!-- COMMERCIANTE -->
			<div class="mb-3">
				<label class="form-label">Commerciante</label> <select
				id="commercianteId"	name="commercianteId" class="form-select" required>
					<option value="">-- Seleziona Commerciante --</option>
					<option th:each="c : ${commercianti}"
						th:value="${c.commerciante_id}" th:text="${c.name}"></option>
				</select>
			</div>

			<!-- DATA -->
			<!-- 			<div class="mb-3"> -->
			<!-- 				<label class="form-label">Data</label> <input type="date" id="data" -->
			<!-- 					class="form-control" required> -->
			<!-- 			</div> -->

			<h5>Bins</h5>

			<div id="binsContainer"></div>

			<button type="button" class="btn btn-primary mb-3" onclick="addBin()">
				+ Aggiungi Bin</button>


			<!-- TOTALI -->
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Peso Lordo</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{peso_lordo}" class="form-control">
				</div>
			</div>
		
			
			<div id="gruppoVenditeContainer"></div>

			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Netto di Tara</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{nettoDiTara}" class="form-control">
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-3 col-form-label">Netto di Scarto</label>
				<div class="col-sm-9">
					<input type="number" th:field="*{nettoDiScarto}"
						class="form-control" step="0.01">
				</div>
			</div>

			<input type="hidden" name="nBins" id="nBins">
			<!-- PREZZO -->
			<div class="mb-3">
				<label class="form-label">Prezzo</label> <input type="number"
					name="prezzo" id="prezzo" class="form-control" step="0.01" >
			</div>

			<!-- SCARTO -->
			<div class="mb-3">
				<label class="form-label">Scarto (%)</label> <input type="number"
					name="scarto" id="scarto" class="form-control" step="0.01">
			</div>

			<!-- SCARTO -->

			<!-- IMPORTO -->
			<div class="mb-3">
				<label class="form-label">Importo</label> <input type="number"
					name="importo" id="importo" class="form-control" readonly>
			</div>

			

			<button type="submit" class="btn btn-success">Salva Vendita
			</button>

		</form>

	</div>

	<!-- ===================== JS ===================== -->
	<script th:inline="javascript">

    const binsList = /*[[${binsJs}]]*/ [];

    let index = 0;

</script>
	<script>
	document.getElementById("commercianteId")
	.addEventListener("change", async function () {

	    const commercianteId = this.value;
	    if (!commercianteId) return;

	    try {

	        const response =
	            await fetch(`/gruppovendite/presente/${commercianteId}`);

	        const presente = await response.json();

	        const container =
	            document.getElementById("gruppoVenditeContainer");

	        const pesoLordoInput =
	            document.querySelector('[name="peso_lordo"]');

	        if (presente) {

	            container.innerHTML = `
	                <div class="form-check mb-3">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="joinGruppo"
	                           id="joinGruppo">
	                    <label class="form-check-label" for="joinGruppo">
	                        Unisci a Gruppo Vendite
	                    </label>
	                </div>
	            `;



	        } else {

	            container.innerHTML = `
	                <div class="form-check mb-3">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="creaGruppo"
	                           id="creaGruppo">
	                    <label class="form-check-label" for="creaGruppo">
	                        Crea gruppo vendite
	                    </label>
	                </div>
	            `;


	        }

	    } catch (e) {
	        console.error("Errore verifica gruppo vendite", e);
	    }
	});


	    async function checkAvailability(row) {

	        const binSelect = row.querySelector(".binSelect");
	        const numBins = row.querySelector(".numBins");
	        const availabilityMsg = row.querySelector(".availabilityMsg");

	        const binId = binSelect.value;
	        const requested = parseInt(numBins.value) || 0;
	        const arrivoId = document.getElementById("arrivoId").value;

	        if (!binId || requested <= 0) {
	            availabilityMsg.innerText = "";
	            return;
	        }

	        try {

	            const res = await fetch(`/api/bin/${binId}/${arrivoId}/availability`);
	            const data = await res.json();

	            const available = data.available || 0;

	            if (requested > available) {

	                availabilityMsg.innerText =
	                    "Disponibili solo " + available;

	                numBins.classList.add("is-invalid");

	            } else {

	                availabilityMsg.innerText =
	                    "Disponibili: " + available;

	                numBins.classList.remove("is-invalid");
	            }

	        } catch (e) {

	            availabilityMsg.innerText =
	                "Errore verifica disponibilità";
	        }
	    }

	    function aggiornaTotali() {

	        let totaleQta = 0;
	        let totaleLordo = 0;
	        let totaleNetto = 0;
	        let totaleTara = 0;

	        document.querySelectorAll(".bin-row").forEach(row => {

	            const qty = Number(row.querySelector(".numBins")?.value) || 0;
	            const lordo = Number(row.querySelector(".pesoLordo")?.value) || 0;
	            const netto = Number(row.querySelector(".pesoNetto")?.value) || 0;

	            totaleQta += qty;
	            totaleLordo += lordo;
	            totaleNetto += netto;

	            totaleTara += (lordo - netto);
	        });

	        // ===== INPUT REFERENCES =====
	        const lordoInput = document.querySelector('[name="peso_lordo"]');
	        const nettoTaraInput = document.querySelector('[name="nettoDiTara"]');
	        const nettoScartoInput = document.querySelector('[name="nettoDiScarto"]');
	        const scartoInput = document.getElementById("scarto");
	        const prezzoInput = document.getElementById("prezzo");

	        const prezzoFrigoCaldoInput = document.getElementById("prezzoFrigoxCaldo");
	        const prezzoFrigoFreddoInput = document.getElementById("prezzoFrigoxFreddo");

	        // ===== SAFE PARSE =====
	        const prezzo = Number(prezzoInput?.value) || 0;
	        const scartoPerc = Number(scartoInput?.value) || 0;

	        const prezzoCaldo = Number(prezzoFrigoCaldoInput?.value) || 0;
	        const prezzoFreddo = Number(prezzoFrigoFreddoInput?.value) || 0;

	        // ===== TOTALI =====
	        if (lordoInput) {
	            lordoInput.value = totaleLordo.toFixed(2);
	        }

	        if (nettoTaraInput) {
	            nettoTaraInput.value = totaleNetto.toFixed(2);
	        }

	        // ===== NETTO SCONTATO =====
	        const nettoDiScarto = totaleNetto * (1 - scartoPerc / 100);

	        if (nettoScartoInput) {
	            nettoScartoInput.value = nettoDiScarto.toFixed(2);
	        }

	        // ===== IMPORTO =====
	        const importo = prezzo * nettoDiScarto;

	        const importoInput = document.getElementById("importo");
	        if (importoInput) {
	            importoInput.value = importo.toFixed(2);
	        }

	        // ===== FRIGO =====
	        const baseFrigo = totaleLordo - (totaleTara / 2);

	        const frigoxCaldo = baseFrigo * prezzoCaldo;
	        const frigoxFreddo = baseFrigo * prezzoFreddo;

	        const frigoxCaldoInput = document.getElementById("frigoxCaldo");
	        const frigoxFreddoInput = document.getElementById("frigoxFreddo");

	        if (frigoxCaldoInput) {
	            frigoxCaldoInput.value = frigoxCaldo.toFixed(2);
	        }

	        if (frigoxFreddoInput) {
	            frigoxFreddoInput.value = frigoxFreddo.toFixed(2);
	        }

	        // ===== COUNT BINS =====
	        const nBinsInput = document.getElementById("nBins");
	        if (nBinsInput) {
	            nBinsInput.value = totaleQta;
	        }
	    }
	    function calcImporto() {

	 
	  
	    }
	    function aggiornaPesi(row) {

	        const qta = Number(row.querySelector('.numBins')?.value) || 0;
	        const binId = row.querySelector('.binSelect')?.value;

	        const bin = binsList.find(b => String(b.id) === String(binId));

	        if (!bin || qta <= 0) {
	            row.querySelector('.pesoLordo').value = "";
	            row.querySelector('.pesoNetto').value = "";
	            aggiornaTotali();
	            return;
	        }

	        const lordoUnitario = Number(bin.pesoLordo ?? 0);
	        const tara = Number(bin.tara ?? 0);

	        const lordo = lordoUnitario * qta;
	        const netto = (lordoUnitario - tara) * qta;

	        row.querySelector('.pesoLordo').value = lordo.toFixed(2);
	        row.querySelector('.pesoNetto').value = netto.toFixed(2);

	        aggiornaTotali();
	    }
	    	
	    function addBin() {

	        const container = document.getElementById("binsContainer");

	        let options = `<option value="">Seleziona Bin</option>`;
	        binsList.forEach(b => {
	            options += `<option value="${b.id}">${b.name}</option>`;
	        });

	        const html = `
	        <div class="row mb-3 bin-row">

	            <div class="col-md-2">
	                <input type="number"
	                       class="form-control numBins"
	                       min="1"
	                       placeholder="Qta">
	            </div>

	            <div class="col-md-3">
	                <select class="form-select binSelect">
	                    ${options}
	                </select>
	            </div>

	            <div class="col-md-2">
	                <input type="number" class="form-control pesoLordo" >
	            </div>

	            <div class="col-md-2">
	                <input type="number" class="form-control pesoNetto" >
	            </div>

	            <div class="col-md-3">
	                <div class="availabilityMsg text-danger small"></div>
	            </div>

	            <div class="col-md-1">
	                <button type="button" class="btn btn-danger btn-sm removeBtn">X</button>
	            </div>

	        </div>`;

	        container.insertAdjacentHTML("beforeend", html);

	        const row = container.lastElementChild;
	
	        const numBins = row.querySelector(".numBins");
	        const binSelect = row.querySelector(".binSelect");
	        const btnRemove = row.querySelector(".removeBtn");
	        const pesoLordo = row.querySelector(".pesoLordo");
	        
	        function handler() {
	            aggiornaPesi(row);
	            checkAvailability(row); 
	        }

	        numBins.addEventListener("input", handler);
	        binSelect.addEventListener("change", handler);

	        btnRemove.addEventListener("click", () => {
	            row.remove();
	            aggiornaTotali();
	        });

	        index++;
	     
	        pesoLordo.addEventListener("input", function () {
	            aggiornaPesoDaLordo(row);
	            aggiornaTotali();
	        });
	    
	    }
	    function removeRow(btn) {

	        btn.closest(".bin-row").remove();

	        aggiornaTotali();
	    }
	    document.getElementById("venditaForm")
	    .addEventListener("submit", function(e){

	        if(document.querySelectorAll(".bin-row").length === 0){
	            e.preventDefault();
	            alert("Inserire almeno un bin");
	            return;
	        }
	        const invalid =
		        document.querySelector(".numBins.is-invalid");

		    if(invalid){
		        e.preventDefault();
		        alert("Quantità non disponibile");
		        return;
		    }
		     invalid = Array.from(document.querySelectorAll(".pesoLordo"))
	        .some(i => Number(i.value) <= 0);

	    if (invalid) {
	        e.preventDefault();
	        alert("Il peso lordo deve essere maggiore di 0 per ogni bin");
	        return;
	    }
	    });
	    
	    
	    
	
	    
	    
	    document.addEventListener("DOMContentLoaded", function () {

	        document.getElementById("prezzo")
	            .addEventListener("input", aggiornaTotali);

	        document.getElementById("scarto")
	            .addEventListener("input", aggiornaTotali);
	    });
	    document.getElementById("venditaForm").addEventListener("submit", function () {

	        const rows = document.querySelectorAll(".bin-row");

	        const bins = [];

	        rows.forEach(row => {

	            const binId = row.querySelector(".binSelect").value;
	            const numBins = parseInt(row.querySelector(".numBins").value) || 0;

	            const pesoLordo = parseFloat(row.querySelector(".pesoLordo").value) || 0;
	            const pesoNetto = parseFloat(row.querySelector(".pesoNetto").value) || 0;

	            if (binId && numBins > 0) {
	                bins.push({
	                    binId,
	                    numBins,
	                    pesoLordo,
	                    pesoNetto
	                });
	            }
	        });

	        document.getElementById("binsJson").value = JSON.stringify(bins);
	    });
	    function aggiornaPesoDaLordo(row) {

	        const qta = Number(row.querySelector('.numBins')?.value) || 0;
	        const binId = row.querySelector('.binSelect')?.value;

	        const bin = binsList.find(b => String(b.id) === String(binId));

	        if (!bin || qta <= 0) return;

	        const tara = Number(bin.tara) || 0;

	        const lordo = Number(row.querySelector('.pesoLordo')?.value) || 0;
	        
	        var netto = 0;
	        
	        if( lordo > 0)
	         netto = lordo - (tara * qta);

	        row.querySelector('.pesoNetto').value = netto.toFixed(2);
	    }
</script>
</body>
</html>
