<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuova Vendita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Crea Nuova Vendita</h2>

    <form th:action="@{/web/vendita/save}" th:object="${vendita}" method="post">
<input type="hidden" th:field="*{arrivoEntity}" />
        <!-- IMPORTO -->
        <div class="mb-3">
            <label class="form-label">Importo</label>
            <input type="number" step="0.01" class="form-control" th:field="*{importo}" required>
        </div>

        <!-- DATA -->
        <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" class="form-control" th:field="*{data}" required>
        </div>

   
        <!-- COMMERCIANTE DROPDOWN -->
        <div class="mb-3">
            <label class="form-label">Commerciante</label>

            <select class="form-select" th:field="*{commerciante.commerciante_id}" required>
                <option value="">-- Seleziona Commerciante --</option>

                <option th:each="c : ${commercianti}"
                        th:value="${c.commerciante_id}"
                        th:text="${c.name}">
                </option>

            </select>
        </div>

        <!-- BIN DROPDOWN -->
        <div class="mb-3">
            <label class="form-label">Bin</label>

            <select class="form-select" th:field="*{bin.id}" required>
                <option value="">-- Seleziona Bin --</option>

                <option th:each="b : ${bins}"
                        th:value="${b.id}"
                        th:text="${b.name}">
                </option>

            </select>
        </div>
     <!-- N BINS -->
<div class="mb-3">
    <label class="form-label">Numero Bins</label>

    <input type="number"
           class="form-control"
           th:field="*{nBins}"
           min="1"
           required>
</div>

        <!-- SUBMIT -->
        <button type="submit" class="btn btn-success">
            Salva Vendita
        </button>

    </form>

</div>

</body>
</html>
