<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Elenco Operazioni Commerciante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Elenco Operazioni Commerciante</h2>

        
    </div>

    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>DTT</th>
            <th>Commerciante</th>
            <th>Bin</th>
            <th>Lordo</th>
            <th>Netto</th>
            <th>Tara</th>
            <th>N° Bins</th>
            <th>Importo</th>
            
        </tr>
        </thead>

        <tbody>

        <tr th:each="op : ${operazioni}">

            <td th:text="${op.id}"></td>

            <td th:text="${op.data}"></td>

            <td th:text="${op.dtt}"></td>

            <td th:text="${op.commerciante != null ? op.commerciante.name : ''}">
            </td>

            <td th:text="${op.bin != null ? op.bin.name : ''}">
            </td>

            <td th:text="${op.lordo}"></td>

            <td th:text="${op.netto}"></td>

            <td th:text="${op.tara}"></td>

            <td th:text="${op.nBins}"></td>

            <td th:text="${op.importo}"></td>

         

        </tr>

        </tbody>

    </table>
<!-- FILTRO COMMERCIANTE -->
<form th:action="@{/web/commercianti/lista/0}"
      method="get"
      class="row g-3 mb-4">

    <div class="col-md-4">

        <label class="form-label">Commerciante</label>

        <select name="commercianteId"
                class="form-select">

            <option value="0">
                -- Tutti --
            </option>

            <option th:each="c : ${commercianti}"
                    th:value="${c.commerciante_id}"
                    th:text="${c.name}"
                  >
            </option>

        </select>

    </div>

    <div class="col-md-2 d-flex align-items-end">

        <button type="submit"
                class="btn btn-success w-100">
            Filtra
        </button>

    </div>

</form>

</div>

</body>
</html>
