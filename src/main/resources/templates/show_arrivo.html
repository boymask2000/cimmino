<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Dettaglio Arrivo</title>

<link rel="stylesheet" href="/css/style.css">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>
<div th:replace="navbar :: navbar"></div>
	<div class="container mt-4">

		<h1 class="text-center mb-4">Dettaglio Arrivo</h1>

		<!-- DATA -->
		<div class="row mb-3">
			<label class="col-sm-3 col-form-label">Data</label>
			<div class="col-sm-9">
				<input type="date" class="form-control" th:value="${arrivo.data}"
					readonly>
			</div>
		</div>

		<!-- MERCE -->
		<div class="row mb-3">
			<label class="col-sm-3 col-form-label">Merce</label>
			<div class="col-sm-9">
				<input type="text" class="form-control"
					th:text="${arrivo.merce!=null?arrivo.merce.name:' '}"
					th:value="${arrivo.merce!=null?arrivo.merce.merce_id:' '}" readonly>
			</div>
		</div>

		<h4>Bins</h4>

		<!-- LISTA BINS -->
		<div class="border p-2">

			<table class="table table-sm table-striped">

				<thead>
					<tr>
						<th>Qta</th>
						<th>Merce</th>
						<th>Bin</th>
						<th>Peso Lordo</th>
						<th>Peso Netto</th>
							<th>Media</th>
					</tr>
				</thead>

				<tbody>

					<tr th:each="b : ${arrivo.bins}">

						<td th:text="${b.numBins}"></td>
						<td th:text="${arrivo.merce.name}"></td>
						<td th:text="${b.bin.name}"></td>
						<td th:text="${b.pesoLordo}"></td>
						<td th:text="${b.pesoNetto}"></td>
						<td th:text="${b.media}"></td>

					</tr>

				</tbody>

			</table>
			
<h4>Bins</h4>



<hr>

<h5>Aggiungi Bin</h5>

<form th:action="@{/web/arrivi/addBin/{id}(id=${arrivo.id})}"
      method="post">

    <div class="row">

        <div class="col-md-3">
            <label>Qta</label>
            <input type="number"
           			 id="numBins"
           			  min="1"
                   name="numBins"
                   class="form-control"
                   required>
        </div>

        <div class="col-md-3">
            <label>Bin</label>
            <select name="binId"
            		id="binId"
                    class="form-select"
                    required>

                <option value="">Seleziona...</option>

                <option th:each="bin : ${binsDisponibili}"
                        th:value="${bin.id}"
                        th:text="${bin.name}">
                </option>

            </select>
        </div>
        <div class="col-md-3">
            <label for="tara" >Tara (kg)</label>
            <input type="number"
                   id="tara"
                   class="form-control"
                   step="0.01"
                   readonly>
        </div>

        <div class="col-md-3">
            <label>Peso Lordo</label>
            <input type="number"
             		id="pesoLordo"
                   step="0.01"
                   name="pesoLordo"
                   class="form-control"
                   required>
        </div>

        <div class="col-md-3">
            <label>Peso Netto</label>
            <input type="number"
            		 id="pesoNetto"
                   step="0.01"
                   name="pesoNetto"
                   class="form-control"
                   required>
        </div>

    </div>

    <div class="mt-3">
        <button class="btn btn-success">
            Aggiungi Bin
        </button>
    </div>

</form>
		</div>

		<!-- TOTALE -->
		<div class="row mt-3">

			<div class="col-md-4">
				<label>Peso Lordo Totale</label> <input class="form-control"
					th:value="${arrivo.peso_lordo}" readonly>
			</div>

			<div class="col-md-4">
				<label>Peso Netto Totale</label> <input class="form-control"
					th:value="${arrivo.peso_netto}" readonly>
			</div>
			
			<div class="col-md-4">
				<label>Media</label> <input class="form-control"
					th:value="${arrivo.media}" readonly>
			</div>
			
			<div class="col-md-4">
				<label>Frigo per Caldo</label> <input class="form-control"
					th:value="${arrivo.frigoxCaldo}" readonly>
			</div>
			<div class="col-md-4">
				<label>Frigo per Freddo</label> <input class="form-control"
					th:value="${arrivo.frigoxFreddo}" readonly>
			</div>

			<div class="col-md-4">
				<label>Calo</label> <input class="form-control"
					th:value="${arrivo.calo}" readonly>
			</div>

		</div>

		<!-- INTESTAZIONE -->
		<div class="row mt-3">
			<label class="col-sm-3 col-form-label">Intestazione</label>
			<div class="col-sm-9">
				<input type="text" class="form-control"
					th:value="${arrivo.intestazione_merce}" readonly>
			</div>
		</div>

		<!-- PULSANTE CANCELLAZIONE -->
		<div class="mt-4 text-end">

			<form th:action="@{/web/arrivi/delete/{id}(id=${arrivo.id})}"
				method="post"
				onsubmit="return confirm('Sei sicuro di voler eliminare questo arrivo?');">

				<div th:if="${arrivo.vendite.size > 0}"
					class="alert alert-danger mt-3 text-center fw-bold">⚠ Non è
					possibile cancellare questo arrivo perché esistono vendite
					collegate</div>
				<div th:if="${arrivo.vendite.size == 0}">

					<button type="submit" class="btn btn-danger"> Elimina Arrivo
					</button>

				</div>

				

			</form>

		</div>

	</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const binSelect = document.getElementById("binId");
    const numBinsInput = document.getElementById("numBins");
    const taraInput = document.getElementById("tara");
    const pesoLordoInput = document.getElementById("pesoLordo");
    const pesoNettoInput = document.getElementById("pesoNetto");

    let taraPerBin = null;

    function calcolaPesoNetto() {
        const quantita = Number(numBinsInput.value);
        const pesoLordo = Number(pesoLordoInput.value);

        if (
            taraPerBin === null ||
            numBinsInput.value === "" ||
            pesoLordoInput.value === "" ||
            quantita <= 0 ||
            pesoLordo < 0
        ) {
            pesoNettoInput.value = "";
            return;
        }

        const pesoNetto = pesoLordo - (taraPerBin * quantita);

        pesoNettoInput.value =
            pesoNetto >= 0 ? pesoNetto.toFixed(2) : "";
    }

    binSelect.addEventListener("change", async () => {
        taraPerBin = null;
        taraInput.value = "";
        pesoNettoInput.value = "";

        if (!binSelect.value) {
            return;
        }

        try {
        	const response = await fetch(
        		    `/api/bin/${encodeURIComponent(binSelect.value)}/tara`
        		);

            if (!response.ok) {
                throw new Error("Impossibile recuperare la tara");
            }

            taraPerBin = Number(await response.json());

            if (!Number.isFinite(taraPerBin) || taraPerBin < 0) {
                taraPerBin = null;
                throw new Error("Valore della tara non valido");
            }

            taraInput.value = taraPerBin.toFixed(2);

            calcolaPesoNetto();

        } catch (error) {
            taraPerBin = null;
            taraInput.value = "";
            pesoNettoInput.value = "";

            alert("Errore nel recupero della tara del bin.");
            console.error(error);
        }
    });

    numBinsInput.addEventListener("input", calcolaPesoNetto);
    pesoLordoInput.addEventListener("input", calcolaPesoNetto);

});
</script>

</body>
</html>
