<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Dettaglio Arrivo</title>

<link rel="stylesheet"
      href="/css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">Dettaglio Arrivo</h1>

    <!-- DATA -->
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Data</label>
        <div class="col-sm-9">
            <input type="date"
                   class="form-control"
                   th:value="${arrivo.data}"
                   readonly>
        </div>
    </div>

    <!-- MERCE -->
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Merce</label>
        <div class="col-sm-9">
            <input type="text"
                   class="form-control"
                  th:text="${arrivo.merce!=null?arrivo.merce.name:' '}"
                  th:value="${arrivo.merce!=null?arrivo.merce.merce_id:' '}"
                   readonly>
        </div>
    </div>

    <h4>Bins</h4>

    <!-- LISTA BINS -->
    <div class="border p-2">

        <table class="table table-sm table-striped">

            <thead>
                <tr>
                    <th>Qta</th>
                    <th>Bin</th>
                    <th>Peso Lordo</th>
                    <th>Peso Netto</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="b : ${arrivo.bins}">

                    <td th:text="${b.numBins}"></td>

                    <td th:text="${b.bin.name}"></td>

                    <td th:text="${b.pesoLordo}"></td>

                    <td th:text="${b.pesoNetto}"></td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- TOTALE -->
    <div class="row mt-3">

        <div class="col-md-4">
            <label>Peso Lordo Totale</label>
            <input class="form-control"
                   th:value="${arrivo.peso_lordo}"
                   readonly>
        </div>

        <div class="col-md-4">
            <label>Peso Netto Totale</label>
            <input class="form-control"
                   th:value="${arrivo.peso_netto}"
                   readonly>
        </div>

        <div class="col-md-4">
            <label>Calo</label>
            <input class="form-control"
                   th:value="${arrivo.calo}"
                   readonly>
        </div>

    </div>

    <!-- INTESTAZIONE -->
    <div class="row mt-3">
        <label class="col-sm-3 col-form-label">Intestazione</label>
        <div class="col-sm-9">
            <input type="text"
                   class="form-control"
                   th:value="${arrivo.intestazione_merce}"
                   readonly>
        </div>
    </div>

</div>

</body>
</html>
