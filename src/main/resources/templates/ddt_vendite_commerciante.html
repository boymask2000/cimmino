<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>DDT Commerciante</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	background-color: #f5f7fa;
	font-family: Arial, sans-serif;
}

.page-container {
	max-width: 1200px;
	margin: 40px auto;
	padding: 20px;
}

.page-title {
	font-size: 2rem;
	font-weight: bold;
	color: #2c3e50;
	margin-bottom: 5px;
}

.subtitle {
	color: #6c757d;
	margin-bottom: 20px;
}

.card-custom {
	background: white;
	border-radius: 18px;
	padding: 25px;
	box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
}

.table thead {
	background-color: #0d6efd;
	color: white;
}

.table th {
	text-align: center;
	vertical-align: middle;
}

.table td {
	text-align: center;
	vertical-align: middle;
}

.clickable-row {
	cursor: pointer;
	transition: 0.15s ease;
}

.clickable-row:hover {
	background-color: #f1f6ff;
}

.riga-selezionata {
	background-color: #d6ecff !important;
}

.btn-action {
	border-radius: 10px;
	font-weight: 500;
}

.badge-ddt {
	font-size: 0.85rem;
	padding: 7px 10px;
	border-radius: 10px;
}

.empty-message {
	text-align: center;
	padding: 40px;
	color: #6c757d;
}
</style>

</head>

<body>

	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid page-container">

		<div class="mb-4">

			<h1 class="page-title">
				<i class="bi bi-receipt"></i>
				Vendite Commerciante
			</h1>

			<div class="subtitle">
				Vendite con eventuale Documento di Trasporto associato
			</div>

			<h3 class="text-primary fw-bold"
				th:text="${commerciante.name}"></h3>

		</div>

		<div class="card-custom">



				<div class="table-responsive">

					<table class="table table-hover align-middle">

						<thead>

							<tr>
								<th>Data</th>
								<th>Importo</th>
								<th>DDT</th>
								<th>Azioni</th>
							</tr>

						</thead>

						<tbody>

							<tr th:if="${#lists.isEmpty(vendite)}">
								<td colspan="4" class="empty-message">

									<i class="bi bi-inbox fs-2"></i>
									<br>
									Nessuna vendita trovata

								</td>
							</tr>

							<tr th:each="ven : ${vendite}"
								class="clickable-row">

								<td th:text="${ven.data}"></td>

								<td class="fw-bold text-success"
									th:text="${'€ ' + ven.importo}"></td>

								
<td th:text="${ven.ddt}"></td>
									

								<td>

									<a th:if="${ven.ddt != null && ven.ddt !=''}"
										th:href="@{/ddt/viewddt/{id}(id=${ven.ddt})}"
										class="btn btn-primary btn-sm btn-action">

										<i class="bi bi-eye"></i>
										Vedi DDT

									</a>
										<a th:if="${ven.ddt != null && ven.ddt !=''}"
										th:href="@{/ddt/annulladdt/{id}(id=${ven.ddt})}"
										class="btn btn-primary btn-sm btn-action">

										<i class="bi bi-eye"></i>
										Annulla DDT

									</a>

								</td>

							</tr>

						</tbody>

					</table>

				</div>

		

		</div>

	</div>

</body>

</html>
