<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>DDT</title>
<link rel="stylesheet" href="/css/style.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
.page-container {
	max-width: 1400px;
	margin: 40px auto;
	padding: 20px;
}

.page-title {
	font-size: 2rem;
	font-weight: bold;
	color: #2c3e50;
	margin-bottom: 25px;
}

.card-custom {
	background: white;
	border-radius: 15px;
	padding: 20px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.table thead {
	background-color: #0d6efd;
	color: white;
}

.table th {
	vertical-align: middle;
	white-space: nowrap;
}

.table td {
	vertical-align: middle;
}

.btn-action {
	min-width: 120px;
	border-radius: 10px;
	font-weight: 500;
}

.table-hover tbody tr:hover {
	background-color: #f1f5ff;
}

.empty-message {
	text-align: center;
	padding: 40px;
	color: #6c757d;
	font-size: 1.1rem;
}
</style>
</head>

<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid page-container">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h1 class="page-title">
				<i class="bi bi-truck"></i> Gestione DDT
			</h1>

		</div>

		<div class="card-custom">

			<div class="table-responsive">

				<table class="table table-hover align-middle">

					<thead>
						<tr>
							<th>Nome</th>
							<th>Indirizzo</th>
							<th>PEC</th>
							<th>Cod. Fiscale</th>
							<th>P. IVA</th>
							<th class="text-center">Nuovo DDT</th>
							<th class="text-center">Storico DDT</th>
						</tr>
					</thead>

					<tbody>

						<tr th:if="${#lists.isEmpty(infos)}">
							<td colspan="7" class="empty-message"><i
								class="bi bi-inbox fs-3"></i> <br> Nessun commerciante
								trovato</td>
						</tr>

						<tr th:each="p : ${infos}">

							<td class="fw-semibold" th:text="${p.commerciante.name}"></td>

							<td th:text="${p.commerciante.indirizzo}"></td>

							<td><span class="text-primary"
								th:text="${p.commerciante.pec}"></span></td>

							<td th:text="${p.commerciante.codFiscale}"></td>

							<td th:text="${p.commerciante.pIva}"></td>

							<td class="text-center"><a
								th:href="@{/ddt/vendite_commercianteNoDDT/{id}(id=${p.commerciante.commerciante_id})}"
								class="btn btn-sm btn-action"
								th:classappend="' btn-success'"
								>

									<i class="bi bi-plus-circle"></i> Crea DDT
							</a></td>

							<td class="text-center"><a
								th:href="@{/ddt/vendite_commerciante/{id}(id=${p.commerciante.commerciante_id})}"
								class="btn btn-primary btn-sm btn-action"> <i
									class="bi bi-file-earmark-text"></i> Visualizza

							</a></td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>
