<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Arrivi</title>

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmDelete(id) {
    Swal.fire({
        title: 'Sei sicuro?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Elimina'
    }).then((result) => {
        if (result.isConfirmed) {

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;

            const form = document.createElement('form');
            form.method = 'post';
            form.action = '/web/vendita/delete/' + id;

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = '_csrf';
            input.value = csrfToken;

            form.appendChild(input);

            document.body.appendChild(form);
            form.submit();
        }
    });
}
</script>
<body>
	<div th:replace="navbar :: navbar"></div>
	<div class="container-fluid mt-4">

		<div class="d-flex justify-content-between align-items-center mb-3">

			<h1 class="mb-0">Arrivi e vendite</h1>

			<a th:href="@{/web/arrivi/new}" class="btn btn-success"> Nuovo
				Arrivo </a> <a th:href="@{/gruppovendite/new}" class="btn btn-success">
				Nuova Vendita </a>

			<form th:action="@{/pdf/filter_arrivi}">

				<input type="hidden" name="startDate" th:value="${startDate}">
				<input type="hidden" name="endDate" th:value="${endDate}">

				<button type="submit" class="btn btn-success">🖨 Stampa</button>

			</form>

		</div>
		
		

<div th:replace="arrivi_fragment :: contenuto"></div>
		
	</div>
</body>
</html>
