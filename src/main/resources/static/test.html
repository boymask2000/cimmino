<!DOCTYPE html>
<html>
<body>

<button onclick="send()">Send</button>

<script>

const ws =
    new WebSocket("ws://localhost:8080/hello");

ws.onopen = () => {
    console.log("OPEN");
};

ws.onmessage = (e) => {
    console.log(e.data);
};

function send() {
    ws.send("ciao");
}

</script>

</body>
</html>
